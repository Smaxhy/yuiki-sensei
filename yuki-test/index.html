<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#F6F1E8">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Yuki test"><link rel="apple-touch-icon" href="icon.png">
<title>Yuki test</title>
<style id="lock-css">
  :root { --bg: #F6F1E8; --ink: #1D1B18; --ink2: #5A5349; --card: #FFFDF9; --line: rgba(29,27,24,.14); --accent: #C93B23; --on: #FFF9F3; --bad: #A93019; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121110; --ink: #F4EFE7; --ink2: #B8B0A4; --card: #1F1D1A; --line: rgba(255,255,255,.13); --accent: #EE6A50; --on: #1A0F0B; --bad: #F59681; color-scheme: dark; } }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 ui-rounded, system-ui, -apple-system, sans-serif; }
  #lock { min-height: 100dvh; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px max(20px, env(safe-area-inset-right)) 24px max(20px, env(safe-area-inset-left)); text-align: center; }
  #lock img { width: 96px; height: 96px; border-radius: 22px; }
  #lock h1 { margin: 6px 0 0; font-size: 26px; letter-spacing: -.02em; } #lock p { margin: 0; color: var(--ink2); max-width: 300px; }
  #lock form { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 320px; margin-top: 8px; }
  #lock input { font: inherit; font-size: 17px; min-height: 54px; padding: 0 16px; border-radius: 16px; border: 1.5px solid var(--line); background: var(--card); color: var(--ink); text-align: center; }
  #lock input:focus-visible, #lock button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #lock button { font: inherit; font-weight: 800; min-height: 54px; border: 0; border-radius: 99px; background: var(--accent); color: var(--on); }
  #lock button:disabled { opacity: .6; } #msg { min-height: 22px; color: var(--bad); font-weight: 700; }
</style></head>
<body>
<div id="lock"><img src="icon.png" alt=""><h1>Yuki test build</h1><p>Private preview. Enter the test password to open it.</p>
  <form id="f"><input id="pw" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Test password" aria-label="Test password">
  <button id="go" type="submit">Open</button></form><div id="msg" role="alert"></div></div>
<div id="root"></div>
<script>
(function () {
  var KEY = "ytest.pw", f = document.getElementById("f"), pw = document.getElementById("pw"), go = document.getElementById("go"), msg = document.getElementById("msg");
  var clean = function (s) { return s.trim().toLowerCase().replace(/\s+/g, ""); };
  async function open(password, typed) {
    go.disabled = true; msg.textContent = ""; go.textContent = "Opening…";
    try {
      var buf = new Uint8Array(await (await fetch("app.bin", { cache: "no-cache" })).arrayBuffer());
      var material = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
      var key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: buf.slice(0, 16), iterations: 600000, hash: "SHA-256" }, material, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
      var plain;
      try { plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.slice(16, 28) }, key, buf.slice(28)); }
      catch (e) { try { localStorage.removeItem(KEY); } catch (x) {} throw new Error(typed ? "That password isn't right." : ""); }
      var text = await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
      var app = JSON.parse(text);
      try { localStorage.setItem(KEY, password); } catch (x) {}
      document.getElementById("lock").remove(); document.getElementById("lock-css").remove();
      var st = document.createElement("style"); st.textContent = app.css; document.head.appendChild(st);
      var sc = document.createElement("script"); sc.type = "module"; sc.src = URL.createObjectURL(new Blob([app.js], { type: "text/javascript" })); document.body.appendChild(sc);
    } catch (e) { go.disabled = false; go.textContent = "Open"; msg.textContent = e && e.message ? (/password/.test(e.message) ? e.message : "Couldn't open it. Check your connection and try again.") : ""; }
  }
  f.addEventListener("submit", function (e) { e.preventDefault(); var p = clean(pw.value); if (p) open(p, true); });
  var saved = null; try { saved = localStorage.getItem(KEY); } catch (x) {}
  if (saved) open(saved, false);
})();
</script>
</body></html>
