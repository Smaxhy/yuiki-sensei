<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Yuki">
<meta name="theme-color" content="#151722">
<title>Yuki Sensei</title>
<link id="touchIcon" rel="apple-touch-icon" href="">
<style>
:root{
  --ink:#151722; --ink2:#1d2030; --ink3:#272b3f; --line:#33384f;
  --text:#eef0f7; --dim:#9298b3; --sakura:#f4a3c0; --sakura2:#d97a9f;
  --matcha:#9fd67c; --sky:#7cb8f4; --gold:#f2c36b; --red:#f27c7c;
  --vh:100dvh; --safeB:env(safe-area-inset-bottom,0px); --safeT:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--ink);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;font-size:16px;overscroll-behavior:none}
body{position:fixed;inset:0;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:active{transform:scale(.97)}
input,textarea,select{font:inherit;font-size:16px;color:var(--text)}
#app{height:var(--vh);display:flex;flex-direction:column;padding-top:var(--safeT)}
#main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative}
#tabs{display:flex;background:var(--ink2);border-top:1px solid var(--line);padding:6px 4px calc(6px + var(--safeB))}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--dim);padding:4px 0;border-radius:10px}
#tabs button .ti{font-size:21px;line-height:1}
#tabs button.on{color:var(--sakura)}
.hidden{display:none!important}
.pad{padding:18px 16px 28px;max-width:560px;margin:0 auto}
.h1{font-size:24px;font-weight:800;letter-spacing:-.02em}
.h2{font-size:19px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--dim);font-size:14px;line-height:1.45}
.sec{font-size:13px;font-weight:700;color:var(--dim);margin:22px 2px 8px}
.card{background:var(--ink2);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:10px}
.hello{display:flex;align-items:center;gap:14px;margin:6px 0 18px}
.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(140deg,var(--sakura),var(--sakura2));display:flex;align-items:center;justify-content:center;font-weight:800;color:#2a1520;flex-shrink:0}
.av.big{width:58px;height:58px;font-size:26px}
.hero{display:block;width:100%;text-align:left;background:linear-gradient(150deg,#3a2433,#22243a);border:1px solid #5a3a4c}
.hero .tag{font-size:12px;color:var(--sakura);font-weight:700;margin-bottom:6px}
.hero .go{margin-top:12px;font-weight:700;color:var(--sakura)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--ink2);border:1px solid var(--line);border-radius:18px;padding:16px 14px;text-align:left;font-weight:700;font-size:15px;display:flex;flex-direction:column;gap:6px;min-height:96px}
.tile .ico{font-size:26px}
.tile small{font-weight:500;color:var(--dim);font-size:12px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--ink2);border:1px solid var(--line);border-radius:16px;padding:13px 14px;margin-bottom:8px}
.row .ri{width:42px;height:42px;border-radius:12px;background:var(--ink3);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;font-weight:700}
.row .rt{flex:1;min-width:0}
.row .rt b{display:block;font-size:15px}
.row .rt span{display:block;font-size:12.5px;color:var(--dim);margin-top:2px;line-height:1.35}
.row.done{border-color:#4b6b3a}
.row.done .ri{background:#2f4426}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;display:inline-flex;align-items:center;min-height:44px;background:var(--ink3);border:1px solid var(--line);border-radius:999px;padding:0 14px;font-size:13.5px;white-space:nowrap}
.chip.on{background:#4a2c3c;border-color:var(--sakura);color:var(--sakura)}
.btn{display:block;width:100%;padding:15px;border-radius:14px;font-weight:700;font-size:16px;background:linear-gradient(140deg,var(--sakura),var(--sakura2));color:#2a1520;text-align:center}
.btn.ghost{background:var(--ink3);color:var(--text);border:1px solid var(--line)}
.btn.sm{padding:10px;font-size:14px;min-height:44px}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--ink);border-radius:12px;padding:12px 6px;text-align:center}
.stat b{display:block;font-size:22px}
.stat span{font-size:11.5px;color:var(--dim)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tg{background:var(--ink3);border-radius:8px;padding:5px 9px;font-size:13px}
.tg.w{background:#4a2630;color:#ffc2cf}
.tg.s{background:#2c4224;color:#c9f0b2}
.field{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px;margin:6px 0 10px;outline:none}
.field:focus{border-color:var(--sakura)}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.toggle:last-child{border-bottom:none}
.sw{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;transition:.2s;flex-shrink:0}
.sw::before{content:"";position:absolute;inset:-7px -4px}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--matcha)}
.sw.on::after{left:23px}
/* chat */
.chat{display:flex;flex-direction:column;height:100%}
.chathead{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--ink2);flex-shrink:0}
.chathead .ct{flex:1;min-width:0}
.chathead .ct b{display:block;font-size:15px}
.chathead .ct small{display:block;color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:44px;background:var(--ink3);border:1px solid var(--line);border-radius:12px;padding:0 12px;font-size:13px;font-weight:700}
.mini.ok{border-color:var(--matcha);color:var(--matcha)}
.iconbtn{width:44px;height:44px;border-radius:14px;background:var(--ink3);border:1px solid var(--line);font-size:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.iconbtn.live{background:#4a2630;border-color:var(--red);animation:throb 1.2s infinite}
.msgs{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 12px;display:flex;flex-direction:column;gap:12px}
.m{display:flex;gap:8px;max-width:100%}
.m.u{justify-content:flex-end}
.bub{max-width:84%;padding:11px 14px;border-radius:18px;font-size:16px;line-height:1.6;word-break:break-word}
.m.a .bub{background:var(--ink2);border:1px solid var(--line);border-bottom-left-radius:6px}
.m.u .bub{background:#4a2c3c;border-bottom-right-radius:6px}
.m.a .av{width:30px;height:30px;font-size:14px;margin-top:2px}
.bubwrap{display:flex;flex-direction:column;gap:4px;max-width:84%}
.bubwrap .bub{max-width:100%}
.say{align-self:flex-start;min-height:44px;font-size:13px;color:var(--dim);padding:0 12px;border-radius:10px;background:var(--ink3)}
.bub code{background:var(--ink3);padding:1px 5px;border-radius:5px}
.listen{display:inline-flex;flex-direction:column;gap:4px;margin:4px 0}
.play{min-height:44px;background:var(--sky);color:#0f2235;font-weight:800;border-radius:10px;padding:0 16px;font-size:14px}
.hid{filter:blur(6px);font-size:14px;color:var(--dim);padding:8px 0;cursor:pointer}
.hid.show{filter:none}
.err{background:#3a2026;border:1px solid #6b3340;border-radius:14px;padding:12px;font-size:14px;line-height:1.5}
.dots{display:flex;gap:5px;padding:4px 2px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--dim);animation:dot 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
.chatfoot{border-top:1px solid var(--line);background:var(--ink2);padding:8px 10px 10px;flex-shrink:0}
.inputbar{display:flex;gap:8px;align-items:flex-end;margin-top:6px}
#inp{flex:1;background:var(--ink);border:1px solid var(--line);border-radius:16px;padding:11px 14px;resize:none;outline:none;max-height:120px;line-height:1.35}
#inp:focus{border-color:var(--sakura)}
.send{width:44px;height:44px;border-radius:14px;background:linear-gradient(140deg,var(--sakura),var(--sakura2));color:#2a1520;font-size:20px;font-weight:900;flex-shrink:0}
/* flashcards */
.fc{perspective:1000px;margin:10px 0 16px}
.fcin{background:var(--ink2);border:1px solid var(--line);border-radius:24px;min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;gap:10px}
.fcf{font-size:84px;font-weight:700;line-height:1.1}
.fcf.long{font-size:44px}
.fcb{font-size:28px;font-weight:800;color:var(--sakura)}
.fcs{font-size:18px;color:var(--dim)}
.bar{height:6px;border-radius:3px;background:var(--ink3);overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--sakura);border-radius:3px}
.kgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.kc{background:var(--ink2);border:1px solid var(--line);border-radius:12px;padding:8px 0;text-align:center}
.kc b{display:block;font-size:26px;font-weight:600}
.kc span{font-size:11px;color:var(--dim)}
.kc.blank{visibility:hidden}
.kc.weak{border-color:var(--red)}
/* voice overlay */
#voice{position:fixed;inset:0;background:radial-gradient(circle at 50% 30%,#2b2340,#121420 70%);z-index:50;display:flex;flex-direction:column;padding:calc(14px + var(--safeT)) 18px calc(18px + var(--safeB))}
.vtop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.orbwrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;min-height:0}
.orb{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd6e6,var(--sakura) 45%,var(--sakura2));box-shadow:0 0 60px #f4a3c055;display:flex;align-items:center;justify-content:center;font-size:56px;font-weight:800;color:#3a1828;transition:.3s}
.orb.listening{animation:breathe 1.1s infinite;box-shadow:0 0 80px #f27c7c88;background:radial-gradient(circle at 35% 30%,#ffe0e0,#f27c7c 50%,#c24f5f)}
.orb.thinking{animation:spin 2.4s linear infinite;opacity:.8}
.orb.speaking{animation:talk .45s infinite alternate}
.vstat{font-size:15px;color:var(--dim);font-weight:600}
.vtext{max-height:30vh;overflow-y:auto;font-size:17px;line-height:1.6;text-align:center;padding:0 6px;width:100%}
.vyou{font-size:14px;color:var(--dim);text-align:center;min-height:20px}
.vctrl{display:flex;justify-content:center;align-items:center;gap:18px;margin-top:10px}
.bigmic{width:86px;height:86px;border-radius:50%;background:linear-gradient(140deg,var(--sakura),var(--sakura2));font-size:36px;box-shadow:0 6px 30px #f4a3c066}
.bigmic.live{background:linear-gradient(140deg,#ff9a9a,#d64f63);animation:throb 1.2s infinite}
.vside{width:54px;height:54px;border-radius:50%;background:var(--ink3);border:1px solid var(--line);font-size:20px}
.vside small{display:block;font-size:9px;color:var(--dim)}
/* sheet + toast */
#sheet{position:fixed;inset:0;background:#000a;z-index:80;display:flex;align-items:flex-end}
#sheet .sh{background:var(--ink2);width:100%;max-height:85vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + var(--safeB))}
#sheet ol{padding-left:20px;line-height:1.6;font-size:15px}
#sheet li{margin-bottom:8px}
#toast{position:fixed;left:50%;bottom:calc(90px + var(--safeB));transform:translateX(-50%);background:#000d;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:90;opacity:0;transition:.25s;pointer-events:none;max-width:88%;text-align:center}
#toast.on{opacity:1}
.prow{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.pchk{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;font-weight:900;color:#1d2a16;font-size:18px}
.prow.ok .pchk{background:var(--matcha);border-color:var(--matcha)}
.ptxt{flex:1;min-width:0;text-align:left;background:var(--ink3);border-radius:12px;padding:9px 12px;min-height:44px}
.ptxt b{display:block;font-size:14.5px}
.ptxt span{display:block;font-size:12px;color:var(--dim);margin-top:1px}
.prow.ok .ptxt b{text-decoration:line-through;opacity:.65}
.dayh{font-size:13px;font-weight:700;color:var(--dim);margin:14px 2px 6px}
.dayh.today{color:var(--sakura)}
.qen{color:var(--dim);font-size:15px;margin:-8px 0 16px}
.qbig{font-size:22px;font-weight:700;line-height:1.5;margin:18px 0 16px}
.obnav{display:flex;gap:8px;margin-top:18px}
.obnav .btn{flex:1}
.obnav .btn.ghost{flex:0 0 96px}
@keyframes dot{0%,80%,100%{opacity:.25}40%{opacity:1}}
@keyframes throb{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes talk{from{transform:scale(1)}to{transform:scale(1.05)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

</div>

<div id="sheet" class="hidden"></div>
<div id="toast"></div>

function migrate(st){
  const arr=x=>Array.isArray(x)?x:[], num=x=>Number.isFinite(+x)?+x:0;
  const obj=x=>x&&typeof x==="object"&&!Array.isArray(x)?x:{};
  ["facts","weak","strong","learned"].forEach(k=>st.profile[k]=arr(st.profile[k]).map(String));
  ["msgs","quizRight","quizWrong","cards","streak"].forEach(k=>st.stats[k]=num(st.stats[k]));
  st.done=arr(st.done);st.chat=arr(st.chat).filter(m=>m&&typeof m.text==="string");st.cards=obj(st.cards);
  for(const id in st.cards){const c=st.cards[id];if(!CARDS[id]||!c||typeof c!=="object")delete st.cards[id];else{c.box=Math.max(0,Math.min(6,num(c.box)));c.due=num(c.due);}}
  if(!LV[st.level])st.level="n5";
  if(st.currentLesson&&!lessonById(st.currentLesson))st.currentLesson=null;
  if(!["claude-haiku-4-5-20251001","claude-sonnet-5-5"].includes(st.settings.model))st.settings.model=DEFAULT.settings.model;
  // v3 → v4: learner profile, level check, reply style, credit saver, voice choice (defaults come from merge)
  st.about.focus=arr(st.about.focus).map(String);
  ["location","native","notes","hira","kata","kanji"].forEach(k=>st.about[k]=typeof st.about[k]==="string"?st.about[k]:"");
  st.about.minutes=num(st.about.minutes)||15;
  if(st.placement&&(!LV[st.placement.level]||typeof st.placement.bands!=="object"))st.placement=null;
  const sty=obj(st.settings.style);
  Object.entries(STYLE_OPTS).forEach(([k,[,opts]])=>{if(!opts.some(([v])=>v===sty[k]))sty[k]=DEFAULT.settings.style[k];});
  sty.simple=!!sty.simple;st.settings.style=sty;
  // v4 → v5: guided plan
  if(st.plan&&(typeof st.plan!=="object"||!/^\d{4}-\d{2}-\d{2}$/.test(st.plan.start||"")))st.plan=null;
  if(st.plan)st.plan.done=obj(st.plan.done);
  if(![6,12,24].includes(+st.settings.history))st.settings.history=12;else st.settings.history=+st.settings.history;
  st.v=DEFAULT.v;
  return st;
}

function addUnique(list,items,cap){(items||[]).forEach(x=>{x=String(x).trim();if(!x)return;const i=list.findIndex(y=>y.toLowerCase()===x.toLowerCase());if(i>=0)list.splice(i,1);list.push(x);});while(list.length>cap)list.shift();}

function md(t){
  let h=esc(t);
  h=h.replace(/\[\[([\s\S]+?)\]\]/g,(m,p)=>`<span class="listen"><button class="play" data-act="sayText" data-text="${p}">▶ Play audio</button><span class="hid" data-act="reveal">${p}</span></span>`);
  h=h.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/__(.+?)__/g,"<b>$1</b>");
  h=h.replace(/^#{1,4}\s*(.+)$/gm,"<b>$1</b>");
  h=h.replace(/^\s*[-*]\s+/gm,"• ");
  h=h.replace(/`([^`]+)`/g,"<code>$1</code>");
  return h.replace(/\n/g,"<br>");
}

const synth=window.speechSynthesis||null;
let voices=[];
function loadVoices(){if(synth)voices=synth.getVoices()||[];}
if(synth){loadVoices();synth.onvoiceschanged=()=>{const had=voices.length;loadVoices();if(!had&&voices.length&&UI.tab==="me"&&S.onboarded&&!UI.obEdit&&!UI.place)rerender();};}
// Novelty voices that ship with iOS/macOS and sound robotic or silly
const NOVELTY=/albert|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|deranged|hysterical|fred|junior|ralph|kathy|grandma|grandpa|eddy|flo\b|reed|rocko|sandy|shelley/i;
const GOOD={en:/ava|zoe|samantha|allison|evan|nathan|noelle|susan|joelle|tom\b|serena|daniel|karen|moira|tessa|google us english/i,ja:/kyoko|o-ren|otoya|hattori|sakura|google 日本語/i};
const vlang=v=>v.lang.replace("_","-").toLowerCase();
function voiceScore(v,L){
  let s=0;const n=v.name;
  if(vlang(v)===L)s+=20;
  if(/premium/i.test(n))s+=60;else if(/enhanced/i.test(n))s+=45;
  if(/siri/i.test(n))s+=35;
  if(GOOD[L.slice(0,2)]&&GOOD[L.slice(0,2)].test(n))s+=15;
  if(v.localService)s+=3;
  if(NOVELTY.test(n))s-=100;
  return s;
}
function voiceList(lang){
  if(synth&&!voices.length)loadVoices();
  const L=lang.toLowerCase();
  return voices.filter(v=>vlang(v).startsWith(L.slice(0,2))).sort((a,b)=>voiceScore(b,L)-voiceScore(a,L));
}
function pickVoice(lang){
  const list=voiceList(lang);
  const chosen=lang.startsWith("ja")?S.settings.voiceJa:S.settings.voiceEn;
  return (chosen&&list.find(v=>v.name===chosen))||list[0]||null;
}
const JP=/[\u3040-\u30ff\u3400-\u9fff\uff66-\uff9f\u3005]/;
function cleanSpeech(t){
  return t.replace(/<<MEM>>[\s\S]*$/,"")
   .replace(/\[\[|\]\]/g,"")
   .replace(/([\u3400-\u9fff\u3005]+)[（(]([\u3040-\u30ff]+)[)）]/g,"$1")
   .replace(/[*_#`>|]/g," ")
   .replace(/\p{Extended_Pictographic}/gu,"")
   .replace(/[→←↑↓•]/g,", ");
}
function segments(t){
  const segs=[];let cur=null;
  for(const ch of t){
    const isJ=JP.test(ch), isL=/[A-Za-z]/.test(ch);
    const kind=isJ?"ja":isL?"en":null;
    if(!cur){cur={k:kind||"en",t:ch};continue;}
    if(kind&&kind!==cur.k&&cur.t.trim().length&&(/[A-Za-z\u3040-\u9fff]/.test(cur.t))){segs.push(cur);cur={k:kind,t:ch};}
    else{if(kind&&!/[A-Za-z\u3040-\u9fff]/.test(cur.t))cur.k=kind;cur.t+=ch;}
  }
  if(cur)segs.push(cur);
  return segs.filter(s=>/[A-Za-z\u3040-\u9fff\u30a0-\u30ff]/.test(s.t));
}
function speak(text,opts){
  opts=opts||{};
  if(!synth){toast("Speech isn't supported in this browser");return;}
  synth.cancel();
  const segs=segments(cleanSpeech(text)).filter(s=>s.k==="ja"||S.settings.speakEnglish||opts.forceEnglish);
  const rate=(opts.rate||S.settings.rate);
  segs.forEach(s=>{
    const u=new SpeechSynthesisUtterance(s.t.trim());
    u.lang=s.k==="ja"?"ja-JP":"en-US";
    const v=pickVoice(u.lang);if(v)u.voice=v;
    // English sounds most natural near normal speed and pitch; Japanese follows the speed slider
    u.rate=s.k==="ja"?rate:Math.max(0.85,Math.min(1.05,rate+0.1));
    u.pitch=s.k==="ja"?1.05:1;
    synth.speak(u);
  });
}
function stopSpeak(){if(synth)synth.cancel();}
let unlocked=false;
document.addEventListener("touchend",()=>{if(unlocked||!synth)return;unlocked=true;try{const u=new SpeechSynthesisUtterance(" ");u.volume=0;synth.speak(u);}catch(e){}},{once:false,passive:true});

let rec=null;
function micSupported(){return !!(window.SpeechRecognition||window.webkitSpeechRecognition);}
function startMic(onText,onDone){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){micHelp("unsupported");return false;}
  stopSpeak();
  try{rec=new SR();}catch(e){micHelp("blocked");return false;}
  rec.lang=S.settings.micLang;rec.interimResults=true;rec.continuous=false;rec.maxAlternatives=1;
  let finalT="",errored=false;
  rec.onresult=e=>{let interim="";for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)finalT+=r[0].transcript;else interim+=r[0].transcript;}onText((finalT+interim).trim());};
  rec.onerror=e=>{errored=true;UI.listening=false;refreshMic();
    if(e.error==="not-allowed"||e.error==="service-not-allowed"||e.error==="audio-capture")micHelp("blocked");
    else if(e.error==="no-speech")toast("I didn't hear anything — tap and try again");
    else if(e.error!=="aborted")toast("Mic problem: "+e.error);};
  rec.onend=()=>{UI.listening=false;refreshMic();if(!errored&&onDone)onDone(finalT.trim());};
  try{rec.start();UI.listening=true;refreshMic();return true;}catch(e){UI.listening=false;micHelp("blocked");return false;}
}
function stopMic(){if(rec){try{rec.stop();}catch(e){}}}
function refreshMic(){const b=$("#micBtn");if(b)b.classList.toggle("live",UI.listening);if(UI.voice)renderVoice();}
function micHelp(kind){
  sheet(`<div class="h2" style="margin-bottom:10px">🎤 The microphone is blocked</div>
  <p class="sub" style="margin-bottom:12px">${kind==="unsupported"?"This browser doesn't support speech recognition.":"Your phone or browser said no to the mic."} Here's how to fix it:</p>
  <ol>
   <li><b>Open the app in Safari</b>, not inside the Claude app. Claude's preview window always blocks the mic.</li>
   <li>iPhone <b>Settings → Apps → Safari → Microphone</b> → set to <b>Ask</b> or <b>Allow</b>.</li>
   <li><b>Settings → General → Keyboard → Enable Dictation</b> must be on. Safari's speech recognition runs through it.</li>
   <li>If it still fails from the home-screen icon, open the same link in regular Safari. Some iOS versions block the mic in home-screen web apps.</li>
   <li><b>Backup that always works:</b> tap the text box and press the 🎤 on your iPhone keyboard. Switch the keyboard to 日本語 to dictate in Japanese.</li>
  </ol>
  <button class="btn" style="margin-top:14px" data-act="closeSheet">Got it</button>`);
}

function learnerCard(){
  const a=S.about,P=S.placement,parts=[];
  if(a.location)parts.push("lives in "+a.location);
  if(a.native)parts.push("native language: "+a.native);
  if(a.hira)parts.push("reads hiragana: "+a.hira);
  if(a.kata)parts.push("reads katakana: "+a.kata);
  if(a.kanji)parts.push("kanji known: "+(KANJI_LV[a.kanji]||a.kanji));
  if(a.focus.length)parts.push("wants to focus on: "+a.focus.join(", "));
  if(a.minutes)parts.push("studies about "+a.minutes+" min a day");
  if(P)parts.push(`level check (${P.date}): ${LV[P.level].label} — `+BANDS.filter(b=>P.bands[b]).map(b=>b.toUpperCase()+" "+P.bands[b][0]+"/"+P.bands[b][1]).join(", "));
  if(a.notes)parts.push("in their own words: "+a.notes.slice(0,300));
  return parts.join("; ")||"not filled in yet";
}
function styleRules(){
  const st=S.settings.style,r=[];
  r.push({short:"Keep replies short: 2-4 short sentences, under 60 words, one idea at a time.",normal:"Keep replies short and chatty: usually under 120 words.",detailed:"You may give fuller explanations (up to about 250 words) with extra examples when teaching."}[st.length]);
  r.push({more:"Explain in English; use Japanese for examples and practice.",balanced:"Mix English explanations with Japanese at their level.",immersion:"Speak mostly Japanese at their level; use English only for tricky explanations or when they're stuck."}[st.english]);
  r.push({auto:"Reading help: match their level. N5: mostly kana, with readings in brackets after kanji like 学校(がっこう). Romaji only for total beginners, and only at first.",romaji:"After every Japanese sentence, add romaji in brackets.",kana:"After every word with kanji, add its reading in brackets, like 学校(がっこう). No romaji.",none:"No romaji and no reading brackets unless they ask."}[st.script]);
  if(st.simple)r.push("Use simple, plain English: short sentences, everyday words, no grammar jargon. If you must use a grammar term, explain it in a few words.");
  return r.map(x=>"- "+x).join("\n");
}
// Two parts: a stable part (who Yuki is, who the student is, how to teach) that the API can cache,
// and a small part that changes every turn (memory, stats, current lesson).
function systemPrompt(mode){
  const L=LV[S.level];
  return `You are Yuki (ゆき), a 26-year-old Japanese tutor from Kyoto who studied linguistics at Waseda. You are this student's personal tutor inside a learning app. You're warm, upbeat, a little playful, and honest. You correct every mistake kindly but clearly. You have your own personality and opinions; you're not a textbook.

STUDENT
- Name: ${S.name||"unknown"}
- Level: JLPT ${L.label} (${L.name}). Goal: ${S.goal||"not stated"}
- Learner card: ${learnerCard()}

HOW TO TEACH
- Match their level and their learner card. Use their focus areas, interests and life for examples.
${styleRules()}
- Real, useful example sentences. Explain why, not just what.
- If they make a mistake, show: what they wrote → the correct version → a one-line reason.
- If they seem frustrated or tired, ease off, encourage, or switch to something fun.
- Follow their requests directly: if they ask for a quiz, give a quiz; a roleplay, play the role; flashcard-style drilling, do it.
- QUIZZES: one question at a time, wait for the answer, say right or wrong with a short reason, keep a running score (e.g. 3/4), finish after 10 or when they say stop, then summarize what to review.
- Make every question easy to understand: write the instruction in English, and put an English translation in brackets after any Japanese question sentence (never give away the answer itself). After they answer, translate the full correct sentence too.
- LISTENING: when you want them to listen without reading, wrap the Japanese in double square brackets like [[きょうは いい てんき ですね]]. The app hides it behind a play button.
- Use line breaks, not big headers or tables.
${mode==="voice"?`- VOICE CALL: they are talking to you out loud and hearing your reply through text-to-speech. Reply in 1-3 short spoken sentences. No lists, no markdown, no brackets, no romaji. Speak like a friend on a call. Keep the conversation going.\n`:""}
MEMORY (very important)
At the very end of EVERY reply, on its own line, write <<MEM>> followed by compact JSON with anything NEW from this turn. Fields (all optional): "facts" (things about the student's life, interests or preferences), "weak" (specific items they got wrong or struggle with), "strong" (things they clearly mastered), "learned" (new words or patterns taught, as "word = meaning"), "right" (number of quiz answers correct this turn), "wrong" (number incorrect this turn), "lessonDone" (true only when the current lesson's core is mastered). If nothing new: <<MEM>>{}. Never mention this line to the student.`;
}
function memoryPrompt(){
  const p=S.profile,les=S.currentLesson&&lessonById(S.currentLesson);
  const due=dueIds(Object.keys(CARDS)).length;
  return `WHAT YOU REMEMBER
- Lessons finished: ${S.done.length?S.done.map(id=>(lessonById(id)||{}).title).filter(Boolean).slice(-15).join(", "):"none yet"}
- Things you know about them: ${p.facts.join("; ")||"nothing yet"}
- Weak spots: ${p.weak.slice(-15).join("; ")||"none recorded"}
- Strong spots: ${p.strong.slice(-10).join("; ")||"none recorded"}
- Recently learned: ${p.learned.slice(-25).join("; ")||"nothing yet"}
- Quiz record: ${S.stats.quizRight} right, ${S.stats.quizWrong} wrong. Flashcards due: ${due}.
${les?`\nCURRENT LESSON: "${les.title}" — ${les.desc} (${LV[les.level].label}, unit "${les.unit}"). Teach it in small steps: short explanation → 2-3 examples → a quick practice question, then wait for their answer. Never dump the whole lesson at once. When they've shown they understand the core of it, congratulate them and tell them they can tap "✓ Done".`:""}`;
}
function buildMessages(){
  const msgs=[];
  S.chat.slice(-(S.settings.history||12)).forEach(m=>{
    if(m.err)return;
    const role=m.role==="user"?"user":"assistant";
    const content=(m.role==="user"&&m.api)?m.api:m.text;
    if(!msgs.length&&role!=="user")return;
    if(msgs.length&&msgs[msgs.length-1].role===role)msgs[msgs.length-1].content+="\n\n"+content;
    else msgs.push({role,content});
  });
  return msgs;
}
// One place that talks to the Anthropic API. With no key saved, it sends no auth
// (that only works inside Claude's own preview); otherwise it uses your key.
async function apiRequest(body){
  const key=S.settings.apiKey.trim();
  const headers={"Content-Type":"application/json"};
  let model="claude-sonnet-4-6";
  body={...body};
  if(key){headers["x-api-key"]=key;headers["anthropic-version"]="2023-06-01";headers["anthropic-dangerous-direct-browser-access"]="true";model=S.settings.model;}
  const smart=key&&model==="claude-sonnet-5-5";
  if(smart){
    // Sonnet 5.5 thinks before answering; low effort keeps a chat tutor fast and cheap.
    // Room is added to max_tokens because thinking counts toward it (you only pay for what's used).
    body.output_config={effort:"low"};body.max_tokens+=1500;
    // If Sonnet declines a message, the API retries it on a fallback model instead of failing.
    headers["anthropic-beta"]="server-side-fallback-2026-07-01";body.fallbacks="default";
  }
  const go=async(h,b)=>{const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:h,body:JSON.stringify({model,...b})});let data=null;try{data=await res.json();}catch(e){}return{res,data};};
  let {res,data}=await go(headers,body);
  if(smart&&res.status===400&&data&&data.error&&/fallback|beta/i.test(data.error.message||"")){
    const h={...headers};delete h["anthropic-beta"];const b={...body};delete b.fallbacks;({res,data}=await go(h,b));
  }
  if(!res.ok||!data||data.error){const msg=(data&&data.error&&data.error.message)||("HTTP "+res.status);const err=new Error(msg);err.status=res.status;throw err;}
  if(data.stop_reason==="refusal"){const err=new Error("refusal");err.refusal=true;throw err;}
  return (data.content||[]).filter(b=>b.type==="text").map(b=>b.text||"").join("").trim();
}
function callAI(mode){
  const max={short:700,normal:1000,detailed:1600}[S.settings.style.length]||1000;
  return apiRequest({max_tokens:max,
    system:[{type:"text",text:systemPrompt(mode),cache_control:{type:"ephemeral"}},{type:"text",text:memoryPrompt()}],
    messages:buildMessages()});
}
function parseMem(raw){
  const i=raw.lastIndexOf("<<MEM>>");
  if(i<0)return{text:raw,mem:{}};
  const text=raw.slice(0,i).trim();let mem={};
  const m=raw.slice(i+7).match(/\{[\s\S]*\}/);
  if(m){try{mem=JSON.parse(m[0]);}catch(e){}}
  return{text,mem};
}
function applyMem(mem){
  const p=S.profile;
  addUnique(p.facts,mem.facts,30);
  addUnique(p.learned,mem.learned,300);
  if(mem.strong){addUnique(p.strong,mem.strong,30);p.weak=p.weak.filter(w=>!mem.strong.some(s=>s.toLowerCase()===w.toLowerCase()));}
  addUnique(p.weak,mem.weak,30);
  if(+mem.right)S.stats.quizRight+=+mem.right;
  if(+mem.wrong)S.stats.quizWrong+=+mem.wrong;
  if(mem.lessonDone&&S.currentLesson&&!S.done.includes(S.currentLesson)){S.done.push(S.currentLesson);toast("✅ Lesson complete!");}
}
async function send(display,apiText,mode){
  display=(display||"").trim();if(!display||UI.busy)return;
  UI.busy=true;touchDay();
  S.chat.push({role:"user",text:display,api:apiText||undefined});S.stats.msgs++;
  while(S.chat.length>200)S.chat.shift();
  save();
  if(!UI.voice&&UI.tab!=="chat"){UI.tab="chat";render();}else appendLast();
  showTyping(true);
  if(UI.voice){UI.vstate="thinking";renderVoice();}
  try{
    const raw=await callAI(UI.voice?"voice":mode);
    const {text,mem}=parseMem(raw);
    applyMem(mem);
    S.chat.push({role:"assistant",text:text||"…"});save();
    // A plan quiz or talk counts as done after a few back-and-forths with Yuki
    if(UI.planCtx&&++UI.planCtx.replies>=4){markTask(UI.planCtx.n,UI.planCtx.i);UI.planCtx=null;}
    showTyping(false);appendLast();
    if(UI.voice){UI.vstate="speaking";renderVoice();speak(text);}
    else if(S.settings.autoSpeakChat)speak(text);
  }catch(err){
    showTyping(false);
    const noKey=!S.settings.apiKey.trim();
    const msg=noKey?"I need my own AI connection to think when I'm running outside Claude. Open <b>Me → AI setup</b> and paste your key — it takes two minutes.":
      (err.refusal?"Hmm, I can't answer that one. Let's try something else!":err.status===401?"Your API key was rejected. Check it in <b>Me → AI setup</b>.":err.status===429?"Too many requests at once — wait a few seconds and try again.":err.status===400&&/credit|balance/i.test(err.message)?"Your API account is out of credit. Top it up in the Anthropic Console.":"I couldn't connect ("+esc(err.message)+"). Check your internet and try again.");
    S.chat.push({role:"assistant",text:msg,err:true});save();appendLast();
    if(UI.voice){UI.vstate="idle";renderVoice();toast("Connection problem — see the chat");}
  }
  UI.busy=false;
  if(UI.voice&&UI.vstate!=="speaking"){UI.vstate="idle";renderVoice();}
}

const isoDay=d=>{d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
function planDate(n){const [y,m,d]=S.plan.start.split("-").map(Number);return new Date(y,m-1,d+n-1);}
const fmtDay=d=>d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});
function taskDone(n,i){const x=PDAYS[n-1].tasks[i];return !!S.plan.done[n+":"+i]||(x.t==="L"&&S.done.includes(x.k));}
const dayDone=d=>d.tasks.every((x,i)=>taskDone(d.n,i));
const curDay=()=>PDAYS.find(d=>!dayDone(d))||null;
function expectedDay(){const t=new Date();t.setHours(0,0,0,0);return Math.max(1,Math.min(PDAYS.length,Math.floor((t-planDate(1))/864e5)+1));}
function markTask(n,i){
  if(!S.plan||taskDone(n,i))return;
  S.plan.done[n+":"+i]=true;save();
  const d=PDAYS[n-1];
  if(dayDone(d))toast(n===PDAYS.length?"🎓 You finished the whole plan! すごい！":"🎉 Day "+n+" complete!",3000);
  else toast("✓ Task done",1200);
}
// Called when something happens in the app, so today's matching task ticks itself off
function planAuto(t,k){
  if(!S.plan)return;const d=curDay();if(!d)return;
  d.tasks.forEach((x,i)=>{if(x.t===t&&(x.k===k||(t==="C"&&x.k==="due"&&k==="all")))markTask(d.n,i);});
}
const DECK_NAME={hira:"Hiragana",kata:"Katakana",vocab:"Core words",kanji:"First kanji"};
function taskInfo(x){
  if(x.t==="L"){const l=lessonById(x.k);return["📖 "+(l?l.title:x.k),"Lesson with Yuki · about 10 min"];}
  if(x.t==="C")return x.k==="due"?["🔁 Review your due flashcards","Whatever's due today · works offline"]:["🃏 "+DECK_NAME[x.k]+" flashcards","One round · about 5 min · works offline"];
  if(x.t==="K")return["あ Look through the hiragana chart","Tap each character to hear it · works offline"];
  if(x.t==="Q"){const q=QUIZZES.find(z=>z[0]===x.k);return["🧩 Quiz: "+(q?q[2]:x.k),"With Yuki · English translations included"];}
  if(x.t==="T")return["🗣️ "+TALK[x.k][0],"Chat or 📞 call with Yuki · about 5 min"];
  return[x.k,""];
}
function taskRow(n,i){

function planStatus(){

function startPlace(fromOb){UI.place={i:0,ans:[],ob:fromOb||0};render();}
function placeResult(ans){
  const bands={};
  PLACE.forEach(([b],i)=>{bands[b]=bands[b]||[0,0];bands[b][1]++;if(ans[i])bands[b][0]++;});
  let level="n5";
  for(let i=0;i<BANDS.length;i++){const [r,t]=bands[BANDS[i]];if(r/t<0.67)break;level=i===0?"n5":i===BANDS.length-1?"n1":BANDS[i+1];}
  return{level,bands,date:dayStr()};
}

    return`<div class="pad" style="text-align:center;padding-top:50px"><div style="font-size:64px">${f.wrong===0?"🌸":"💪"}</div>
    <div class="h1" style="margin:10px 0">${f.wrong===0?"Perfect round!":"Round done!"}</div>
    <p class="sub">${f.right} right · ${f.wrong} missed</p>

    <button class="btn sm" style="margin-top:12px" data-act="askMisses">Ask Yuki for tricks to remember these</button></div>`:""}
    <button class="btn ghost" style="margin-top:12px" data-act="deck" data-d="${f.deck}">Another round</button>
    <button class="btn ghost" style="margin-top:8px" data-act="closeDeck">Done</button></div>`;
  }
  const c=CARDS[f.q[f.i]];
  return`<div class="pad"><div style="display:flex;justify-content:space-between;align-items:center"><button class="mini" data-act="closeDeck">✕ Stop</button><span class="sub">${f.i+1} / ${f.q.length}</span></div>
  <div class="bar"><i style="width:${Math.round(f.i/f.q.length*100)}%"></i></div>
  <div class="fc" data-act="flip"><div class="fcin">
   <div class="fcf${c.front.length>2?" long":""}">${esc(c.front)}</div>
   ${f.flip?`${c.sub?`<div class="fcs">${esc(c.sub)}</div>`:""}<div class="fcb">${esc(c.back)}</div>`:`<div class="sub">Think of the answer, then tap to flip</div>`}
  </div></div>
  <button class="btn ghost sm" data-act="sayCard" style="margin-bottom:10px">🔊 Hear it again</button>
  ${f.flip?`<div class="grid2"><button class="btn ghost" style="border-color:var(--red)" data-act="grade" data-ok="0">✗ Missed it</button><button class="btn" style="background:var(--matcha)" data-act="grade" data-ok="1">✓ Got it</button></div>`:`<button class="btn" data-act="flip">Show answer</button>`}
  </div>`;
}
const INT=[0,10*60e3,864e5,3*864e5,7*864e5,16*864e5,35*864e5];
function grade(ok){
  const f=UI.fc,id=f.q[f.i],c=S.cards[id]||{box:0,due:0},card=CARDS[id];
  if(ok){c.box=Math.min(c.box+1,6);c.due=Date.now()+INT[c.box];f.right++;
    if(c.box>=3){S.profile.weak=S.profile.weak.filter(w=>w!==card.label);}}
  else{c.box=0;c.due=Date.now();f.wrong++;f.missed.push(id);addUnique(S.profile.weak,[card.label],30);
    if(!f.requeued[id]){f.requeued[id]=1;f.q.push(id);}}
  S.cards[id]=c;S.stats.cards++;touchDay();save();
  f.i++;f.flip=false;if(f.i>=f.q.length)planAuto("C",f.deck);render();setTimeout(speakCard,200);
}

const QUIZ_PROMPTS={
  kana:"Give me a 10-question kana reading quiz: show a short hiragana or katakana word (only kana I've learned), I type how it sounds in romaji, then tell me what it means. One at a time.",
  mixed:"Give me a 10-question mixed quiz at my level (vocab, grammar, kanji, reading). One question at a time.",
    vocab:"Give me a 10-question vocabulary quiz at my level, mixing Japanese→English and English→Japanese. One at a time.",
  grammar:"Give me a 10-question grammar quiz at my level: fill-in-the-blank particles and verb forms. One at a time.",
  kanji:"Give me a 10-question kanji quiz at my level: readings and meanings. One at a time.",
  listen:"Give me a 10-question listening quiz. Put each Japanese sentence in [[double brackets]] so it's hidden, then ask me a question about it. One at a time.",
  translate:"Give me a 10-sentence English→Japanese translation challenge at my level, using things I've learned. One at a time, correct each one carefully.",
  roleplay:"Let's do a roleplay. Pick a realistic situation for my level and goal (café, station, hotel, shop, meeting someone new), set the scene in one line, then start speaking in character in Japanese. Correct me gently as we go."
};
function startQuiz(q){
  const t=QUIZZES.find(x=>x[0]===q);
  let p=QUIZ_PROMPTS[q];
  if(q==="weak")p=`Drill my weak spots with a 10-question quiz, one at a time: ${S.profile.weak.slice(-12).join(", ")||"pick what learners at my level usually struggle with"}.`;
  S.currentLesson=null;save();UI.tab="chat";render();
  send(`🧩 ${t?t[2]:"Quiz"}`,p);
}

  keyHelp:()=>sheet(`<div class="h2" style="margin-bottom:10px">Getting Yuki's brain (API key)</div><ol>
    <li>Go to <b>console.anthropic.com</b> in Safari and sign up.</li>
    <li>Open <b>Billing</b> and add a little credit. Set a monthly spend limit there so you're never surprised.</li>
    <li>Open <b>API Keys → Create Key</b>, name it "Yuki", and copy it.</li>
    <li>Come back here, paste it in the box, tap <b>Save key</b>, then <b>Test Yuki</b>.</li></ol>
    <p class="sub" style="margin-top:10px">The key lives only on this phone. The app file itself has no key in it, so sharing the link doesn't share your key. Pick "Fast & cheap" if you want it to cost less.</p>
    <button class="btn" style="margin-top:14px" data-act="closeSheet">Got it</button>`),
  testVoice:()=>speak("こんにちは！ゆきです。 Hi, this is how I sound.",{forceEnglish:true}),
  exportData:()=>{const d=JSON.stringify({...S,settings:{...S.settings,apiKey:""}});sheet(`<div class="h2">Backup</div><p class="sub" style="margin:8px 0">Copy this and keep it somewhere safe (Notes works). Your API key isn't included.</p><textarea class="field" rows="6" readonly>${esc(d)}</textarea><button class="btn" data-act="copyBackup">Copy</button><button class="btn ghost" style="margin-top:8px" data-act="closeSheet">Close</button>`);},
  copyBackup:()=>{const t=document.querySelector("#sheet textarea");if(navigator.clipboard)navigator.clipboard.writeText(t.value).then(()=>toast("Copied"),()=>{t.select();toast("Select all and copy");});else{t.select();toast("Select all and copy");}},
  importData:()=>sheet(`<div class="h2">Restore</div><p class="sub" style="margin:8px 0">Paste a backup below.</p><textarea id="impT" class="field" rows="6"></textarea><button class="btn" data-act="doImport">Restore</button><button class="btn ghost" style="margin-top:8px" data-act="closeSheet">Cancel</button>`),
  doImport:()=>{try{const d=JSON.parse($("#impT").value);const key=S.settings.apiKey;S=migrate(merge(JSON.parse(JSON.stringify(DEFAULT)),d));S.settings.apiKey=key;save();closeSheet();toast("Restored ✅");render();}catch(e){toast("That doesn't look like a backup");}},
  clearChat:()=>{if(confirm("Clear the chat? Your progress and what Yuki knows about you stay.")){S.chat=[];S.currentLesson=null;save();toast("Chat cleared");}},
  resetAll:()=>{if(confirm("Erase EVERYTHING — progress, cards, memory, chat?")){const key=S.settings.apiKey;S=JSON.parse(JSON.stringify(DEFAULT));S.settings.apiKey=key;UI.ob=0;UI.obEdit=false;UI.place=null;UI.tab="home";save();render();}},
  checkUpdate:()=>checkUpdate(true),
  closeSheet:()=>closeSheet()
};
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;
  const fn=ACT[el.dataset.act];if(!fn)return;
  if(el.closest("#sheet")&&el.dataset.act!=="closeSheet"&&el.dataset.act!=="copyBackup"&&el.dataset.act!=="doImport")closeSheet();
  fn(el,e);
});
document.addEventListener("change",e=>{
  const el=e.target;const k=el.dataset&&el.dataset.set;if(!k)return;
  if(k==="name"||k==="goal")S[k]=el.value.trim();
  else if(k.startsWith("about."))S.about[k.slice(6)]=el.value.trim();
  else if(k==="voice.en"||k==="voice.ja"){S.settings[k==="voice.en"?"voiceEn":"voiceJa"]=el.value;save();speak(k==="voice.en"?"Hi! This is how I'll sound in English.":"こんにちは、ゆきです。",{forceEnglish:true});return;}
  else if(k==="rate")S.settings.rate=parseFloat(el.value);
  else if(k==="model")S.settings.model=el.value;
  save();if(k==="rate")speak("この速さでどうですか？",{});
});

// Save typed profile answers as you type, so a re-render never loses them
document.addEventListener("input",e=>{const k=e.target.dataset&&e.target.dataset.set;if(k&&k.startsWith("about.")){S.about[k.slice(6)]=e.target.value;save();}});

/* ============ iPHONE LAYOUT ============ */
function fitViewport(){const vv=window.visualViewport;const h=vv?vv.height:window.innerHeight;document.documentElement.style.setProperty("--vh",h+"px");window.scrollTo(0,0);const b=$("#msgs");if(b)b.scrollTop=b.scrollHeight;}
if(window.visualViewport){visualViewport.addEventListener("resize",fitViewport);}
window.addEventListener("resize",fitViewport);
(function icon(){try{const c=document.createElement("canvas");c.width=c.height=180;const x=c.getContext("2d");const g=x.createLinearGradient(0,0,180,180);g.addColorStop(0,"#f4a3c0");g.addColorStop(1,"#a8577a");x.fillStyle=g;x.fillRect(0,0,180,180);x.fillStyle="#2a1520";x.font="bold 110px 'Hiragino Sans',sans-serif";x.textAlign="center";x.textBaseline="middle";x.fillText("ゆ",90,98);$("#touchIcon").href=c.toDataURL("image/png");}catch(e){}})();

/* ============ UPDATES ============ */
// Auto-update: compare this page's own code with the live copy on GitHub Pages.
// Comparing the code itself (not just APP_VERSION) means any change gets picked up.
let lastCheck=0,updPending=false;
const UPD_KEY="yuki-upd-at";
const norm=t=>(t||"").replace(/\r\n/g,"\n").trim();
function liveDiffers(html){
  const js=(html.match(/<script>([\s\S]*?)<\/script>/)||[])[1],css=(html.match(/<style>([\s\S]*?)<\/style>/)||[])[1];
  if(js===undefined||css===undefined)return false;
  return norm(js)!==norm(document.querySelector("script").textContent)||norm(css)!==norm(document.querySelector("style").textContent);
}
// Safe moment = nothing in progress that a reload would interrupt
function canReloadNow(){
  const a=document.activeElement,typing=a&&/INPUT|TEXTAREA/.test(a.tagName)&&a.value;
  const midCards=UI.fc&&UI.fc.i>0&&UI.fc.i<UI.fc.q.length;
  return !UI.busy&&!UI.voice&&!UI.listening&&!UI.place&&!midCards&&!typing;
}
function applyUpdate(){
  // Loop guard: never auto-reload more than once every 2 minutes
  let at=0;try{at=+localStorage.getItem(UPD_KEY)||0;}catch(e){}
  if(Date.now()-at<120e3)return false;
  try{localStorage.setItem(UPD_KEY,String(Date.now()));}catch(e){}
  saveNow();location.replace(location.pathname+"?v="+Date.now());return true;
}
function checkUpdate(manual){
  if(location.protocol==="file:"){if(manual)toast("Updates only work on the website version");return;}
  lastCheck=Date.now();
  fetch(location.pathname+"?check="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.text():"").then(t=>{
    if(!t||!liveDiffers(t)){if(manual)toast("You're on the latest version ✓");return;}
    if(manual||canReloadNow()){if(!applyUpdate()&&manual)toast("Updating… if nothing changes, close and reopen Yuki");}
    else if(!updPending){updPending=true;toast("✨ Update ready — it'll load next time you open Yuki",3000);}
  }).catch(()=>{if(manual)toast("Couldn't check — are you online?");});
}
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="hidden"){saveNow();if(updPending)applyUpdate();return;}
  if(updPending){if(applyUpdate())return;}
  if(Date.now()-lastCheck>60e3)checkUpdate(false);
});
// While the app stays open, look again every 15 minutes
setInterval(()=>{if(document.visibilityState==="visible")checkUpdate(false);},15*60e3);

/* ============ START ============ */
loadState().then(()=>{fitViewport();render();setTimeout(()=>checkUpdate(false),1500);});
</script>
