<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Yuki">
<meta name="theme-color" content="#151722">
<title>Yuki Sensei</title>
<link id="touchIcon" rel="apple-touch-icon" href="">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<script id="themeBoot">try{var t=(JSON.parse(localStorage.getItem("yuki-sensei-v3")||"{}").settings||{}).theme||"light";if(t==="light"||(t==="auto"&&matchMedia("(prefers-color-scheme: light)").matches))document.documentElement.classList.add("light");}catch(e){document.documentElement.classList.add("light");}</script>
<style>
:root{
  --ink:#151722; --ink2:#1d2030; --ink3:#272b3f; --line:#33384f;
  --text:#eef0f7; --dim:#9298b3; --sakura:#f4a3c0; --sakura2:#d97a9f;
  --matcha:#9fd67c; --sky:#7cb8f4; --gold:#f2c36b; --red:#f27c7c;
  color-scheme:dark;
  --vh:100dvh; --safeB:env(safe-area-inset-bottom,0px); --safeT:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--ink);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;font-size:16px;overscroll-behavior:none}
body{position:fixed;inset:0;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:active{transform:scale(.97)}
input,textarea,select{font:inherit;font-size:16px;color:var(--text)}
#app{height:var(--vh);display:flex;flex-direction:column;padding-top:var(--safeT)}
#main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative}
#tabs{display:flex;gap:4px;background:var(--ink2);border:1px solid var(--line);border-radius:28px;margin:4px 10px calc(6px + var(--safeB));padding:6px}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:700;color:var(--dim);min-height:52px;border-radius:22px}
#tabs button .ti{font-size:21px;line-height:1}
#tabs button.on{color:var(--sakura);background:var(--ink3)}
/* path */
.ptop{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 12px 4px;max-width:560px;margin:0 auto}
.pill{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;background:var(--ink2);border:1px solid var(--line);font-weight:800;font-size:16px}
.pill.fire{background:#3a2a12;border-color:#6b4a1c;color:var(--gold)}
.pathwrap{max-width:560px;margin:0 auto;padding:0 12px 40px}
#unitHead{position:sticky;top:6px;z-index:5;display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin:6px 0 -76px;height:70px;transition:opacity .2s;background:#1d2030ee;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:22px;padding:14px 16px}
#unitHead .uh{flex:1;min-width:0}
#unitHead small{display:block;color:var(--dim);font-weight:800;font-size:12.5px;letter-spacing:.03em}
#unitHead b{display:block;font-size:18px;margin-top:2px}
.unitpill{display:block;width:fit-content;max-width:92%;margin:34px auto 20px;padding:10px 18px;border-radius:999px;background:var(--ink2);color:var(--dim);font-weight:800;font-size:14px;text-align:center}
.nwrap{display:flex;flex-direction:column;align-items:center;margin:12px auto;width:170px}
.node{width:86px;height:86px;border-radius:32px;background:radial-gradient(circle at 40% 35%,#2e3160,#191b30);display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;color:#c9c2ff;position:relative}
.node.done{box-shadow:0 0 46px #9fd67c26}
.node .bd{position:absolute;right:-8px;bottom:-8px;width:34px;height:34px;border-radius:50%;background:var(--matcha);color:#173012;font-size:17px;font-weight:900;display:flex;align-items:center;justify-content:center;border:3px solid var(--ink)}
.node.cur{background:linear-gradient(140deg,var(--sakura),var(--sakura2));color:#2a1520;box-shadow:0 0 0 7px #f4a3c030,0 0 50px #f4a3c066;animation:throb 1.6s infinite}
.node.todo{opacity:.5}
.node.star{background:radial-gradient(circle at 40% 35%,#6a5520,#2a2312);color:var(--gold)}
.node.star.cur{background:linear-gradient(140deg,#f6d27a,#d9a640);color:#2a1d05}
.nlab{font-size:12.5px;color:var(--dim);margin-top:9px;text-align:center;line-height:1.3}
.nwrap.cur .nlab{color:var(--text);font-weight:700}
.tip{background:var(--text);color:var(--ink);font-weight:900;font-size:13px;padding:6px 12px;border-radius:10px;margin-bottom:12px;position:relative;letter-spacing:.04em}
.tip::after{content:"";position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);border:6px solid transparent;border-bottom:0;border-top-color:var(--text)}
#unitHead.ghost{opacity:0;pointer-events:none}
.ubanner{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin:30px 0 14px;padding:14px 16px;border-radius:22px;background:linear-gradient(135deg,color-mix(in srgb,var(--uc) 22%,var(--ink2)),var(--ink2));border:1px solid color-mix(in srgb,var(--uc) 35%,var(--line))}
.ube{font-size:30px;width:48px;height:48px;border-radius:16px;background:color-mix(in srgb,var(--uc) 25%,transparent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ubt{flex:1;min-width:0}.ubt small{display:block;font-size:12px;font-weight:800;color:var(--uc);letter-spacing:.05em;text-transform:uppercase}.ubt b{display:block;font-size:18px}
.ubp{font-size:13px;font-weight:800;color:var(--dim)}
.uhe{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.node{--uc:#c9c2ff}
.node:not(.cur):not(.star){background:radial-gradient(circle at 40% 30%,color-mix(in srgb,var(--uc) 30%,#262a48),#181a2e)}
.node.cur{background:linear-gradient(140deg,color-mix(in srgb,var(--uc) 80%,#fff),var(--uc));box-shadow:0 0 0 7px color-mix(in srgb,var(--uc) 22%,transparent),0 0 50px color-mix(in srgb,var(--uc) 45%,transparent)}
.node.kana{font-size:38px;color:#fff}
.nlab small{display:block;font-weight:500;color:var(--dim);font-size:11.5px;margin-top:2px}
.lp{padding-top:12px}
.lphead{display:flex;align-items:center;gap:10px}
.lpsteps{flex:1;display:flex;gap:6px;justify-content:center}
.lpsteps span{font-size:12.5px;font-weight:800;color:var(--dim);padding:6px 10px;border-radius:999px;background:var(--ink2)}
.lpsteps span.on{color:var(--ink);background:var(--text)}
.lpsteps span.ok{color:var(--matcha)}
.lpk{margin:18px 2px 10px;font-weight:700}
.wcard{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;padding:34px 18px 22px;border-radius:28px;background:linear-gradient(160deg,color-mix(in srgb,var(--uc) 18%,var(--ink2)),var(--ink2));border:1px solid var(--line)}
.wjp{font-size:44px;font-weight:800;line-height:1.25;text-align:center;word-break:keep-all}
.wro{font-size:18px;color:var(--sky);font-weight:700}
.wen{font-size:20px;font-weight:700;margin-top:4px;text-align:center}
.whear{font-size:13px;color:var(--dim);margin-top:10px}
.qcard{display:flex;flex-direction:column;align-items:center;padding:26px 16px;border-radius:24px;background:var(--ink2);margin-bottom:12px}
.qen2{font-size:24px;font-weight:800;text-align:center}
.opts{display:grid;gap:8px}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;min-height:56px;padding:12px 16px;border-radius:16px;background:var(--ink2);border:2px solid var(--line);text-align:left}
.opt b{font-size:18px}.opt span{font-size:13px;color:var(--dim)}
.opt.right{border-color:var(--matcha);background:#24361d}
.opt.wrong{border-color:var(--red);background:#3a2026}
.opt.dim{opacity:.45}
.fb{margin:12px 2px;font-weight:800}.fb.ok{color:var(--matcha)}.fb.no{color:var(--red)}
.tbar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid #ffffff0d;overflow-x:auto}
.tbar>.sub{flex-shrink:0;font-size:12px;font-weight:700}
.tchips{display:flex;gap:6px}
.tchip{flex-shrink:0;font-size:14px;font-weight:700;padding:6px 10px;border-radius:999px;background:var(--ink3);border:1px solid var(--line)}
.tchip.ok{background:#24361d;border-color:var(--matcha);color:var(--matcha)}
.ctbtn{text-align:left;background:none;border:none;padding:0;min-height:44px}
.caret{font-size:12px;color:var(--dim)}
.mtag{display:block;width:fit-content;margin:4px auto 0;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:#7cb8f422;color:var(--sky)}
.mtag.sp{background:#f4a3c022;color:var(--sakura)}
.mtag.ts{background:#f2c36b22;color:var(--gold)}
.vchips{width:100%;overflow-x:auto;display:flex;justify-content:center}
.vchips .tchips{flex-wrap:wrap;justify-content:center}
.donecard{margin:8px 12px;padding:14px;border-radius:18px;background:linear-gradient(140deg,#24361d,#1d2030);border:1px solid var(--matcha);display:flex;flex-direction:column;gap:4px}
.donecard b{font-size:16px;color:var(--matcha)}.donecard span{font-size:13px;color:var(--dim)}
.donecard.incall{margin:10px 0 0;width:100%;max-width:420px;text-align:center}
.donebtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.urow{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.urow:last-child{border-bottom:none}
.urow i{font-style:normal;width:24px;text-align:center;color:var(--matcha);font-weight:900}
.hidden{display:none!important}
.pad{padding:18px 16px 28px;max-width:560px;margin:0 auto}
.h1{font-size:24px;font-weight:800;letter-spacing:-.02em}
.h2{font-size:19px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--dim);font-size:14px;line-height:1.45}
.sec{font-size:13px;font-weight:700;color:var(--dim);margin:22px 2px 8px}
.card{background:var(--ink2);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:10px}
.hello{display:flex;align-items:center;gap:14px;margin:6px 0 18px}
.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(140deg,var(--sakura),var(--sakura2));display:flex;align-items:center;justify-content:center;font-weight:800;color:#2a1520;flex-shrink:0}
.av.big{width:58px;height:58px;font-size:26px}
.hero{display:block;width:100%;text-align:left;background:linear-gradient(150deg,#3a2433,#22243a);border:1px solid #5a3a4c}
.hero .tag{font-size:12px;color:var(--sakura);font-weight:700;margin-bottom:6px}
.hero .go{margin-top:12px;font-weight:700;color:var(--sakura)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--ink2);border:1px solid var(--line);border-radius:18px;padding:16px 14px;text-align:left;font-weight:700;font-size:15px;display:flex;flex-direction:column;gap:6px;min-height:96px}
.tile .ico{font-size:26px}
.tile small{font-weight:500;color:var(--dim);font-size:12px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--ink2);border:1px solid var(--line);border-radius:16px;padding:13px 14px;margin-bottom:8px}
.row .ri{width:42px;height:42px;border-radius:12px;background:var(--ink3);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;font-weight:700}
.row .rt{flex:1;min-width:0}
.row .rt b{display:block;font-size:15px}
.row .rt span{display:block;font-size:12.5px;color:var(--dim);margin-top:2px;line-height:1.35}
.row.done{border-color:#4b6b3a}
.row.done .ri{background:#2f4426}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;display:inline-flex;align-items:center;min-height:44px;background:var(--ink3);border:1px solid var(--line);border-radius:999px;padding:0 14px;font-size:13.5px;white-space:nowrap}
.chip.on{background:#4a2c3c;border-color:var(--sakura);color:var(--sakura)}
.btn{display:block;width:100%;padding:15px;border-radius:14px;font-weight:700;font-size:16px;background:linear-gradient(140deg,var(--sakura),var(--sakura2));color:#2a1520;text-align:center}
.btn.ghost{background:var(--ink3);color:var(--text);border:1px solid var(--line)}
.btn.sm{padding:10px;font-size:14px;min-height:44px}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--ink);border-radius:12px;padding:12px 6px;text-align:center}
.stat b{display:block;font-size:22px}
.stat span{font-size:11.5px;color:var(--dim)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tg{background:var(--ink3);border-radius:8px;padding:5px 9px;font-size:13px}
.tg.w{background:#4a2630;color:#ffc2cf}
.tg.s{background:#2c4224;color:#c9f0b2}
.field{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px;margin:6px 0 10px;outline:none}
.field:focus{border-color:var(--sakura)}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.toggle:last-child{border-bottom:none}
.sw{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;transition:.2s;flex-shrink:0}
.sw::before{content:"";position:absolute;inset:-7px -4px}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--matcha)}
.sw.on::after{left:23px}
/* chat */
.chat{display:flex;flex-direction:column;height:100%}
.chathead{display:flex;align-items:center;gap:10px;padding:8px 12px;flex-shrink:0;border-bottom:1px solid #ffffff0d}
.chathead .ct{flex:1;min-width:0}
.chathead .ct b{display:block;font-size:16px}
.chathead .ct small{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chathead .ct small::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--matcha);flex-shrink:0}
.mini{display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:44px;background:var(--ink3);border:1px solid var(--line);border-radius:12px;padding:0 12px;font-size:13px;font-weight:700}
.mini.ok{border-color:var(--matcha);color:var(--matcha)}
.iconbtn{width:44px;height:44px;border-radius:50%;background:var(--ink3);border:none;font-size:19px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.iconbtn.call{background:linear-gradient(140deg,var(--sakura),var(--sakura2))}
.iconbtn.live{background:#4a2630;box-shadow:0 0 0 2px var(--red);animation:throb 1.2s infinite}
.msgs{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 14px;display:flex;flex-direction:column;gap:6px}
.m{display:flex;gap:8px;max-width:100%}
.m.u{justify-content:flex-end;margin-top:8px}
.m.a{margin-top:8px}
.m.a.cont{margin-top:0}
.bub{max-width:82%;padding:11px 15px;border-radius:20px;font-size:16px;line-height:1.6;word-break:break-word}
.m.a .bub{background:var(--ink2);border-bottom-left-radius:6px}
.m.u .bub{background:linear-gradient(140deg,#5a3247,#46283a);border-bottom-right-radius:6px}
.bubwrap{display:flex;flex-direction:column;max-width:86%}
.bubwrap .bub{max-width:100%;position:relative;padding-bottom:6px}
.bub.withsay{display:flex;align-items:flex-end;gap:2px;padding-right:4px;padding-bottom:4px}
.bub.withsay>.bt{flex:1;min-width:0;padding-bottom:7px}
.say{width:44px;height:44px;margin:-4px -2px -2px 0;border-radius:12px;font-size:17px;opacity:1;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.say.on{color:var(--sakura)}
.bub code{background:var(--ink3);padding:1px 5px;border-radius:5px}
.listen{display:inline-flex;flex-direction:column;gap:4px;margin:4px 0}
.play{min-height:44px;background:var(--sky);color:#0f2235;font-weight:800;border-radius:12px;padding:0 16px;font-size:14px}
.hid{filter:blur(6px);font-size:14px;color:var(--dim);padding:8px 0;cursor:pointer}
.hid.show{filter:none}
.err{background:#3a2026;border:1px solid #6b3340;border-radius:16px;padding:12px;font-size:14px;line-height:1.5;max-width:86%}
.dots{display:flex;gap:5px;padding:4px 2px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--dim);animation:dot 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
.chatfoot{padding:6px 10px 8px;flex-shrink:0}
.chatfoot .chips{padding-bottom:6px}
.chatfoot .chip{min-height:40px;font-size:13px;background:transparent}
.inputbar{display:flex;gap:6px;align-items:flex-end;background:var(--ink2);border:1px solid var(--line);border-radius:26px;padding:4px}
.inputbar:focus-within{border-color:var(--sakura)}
.inputbar .iconbtn{background:transparent}
#inp{flex:1;background:transparent;border:none;padding:11px 4px;resize:none;outline:none;max-height:120px;line-height:1.35}
.send{width:44px;height:44px;border-radius:50%;background:linear-gradient(140deg,var(--sakura),var(--sakura2));color:#2a1520;font-size:20px;font-weight:900;flex-shrink:0}
/* flashcards */
.fc{perspective:1000px;margin:10px 0 16px}
.fcin{background:var(--ink2);border:1px solid var(--line);border-radius:24px;min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;gap:10px}
.fcf{font-size:84px;font-weight:700;line-height:1.1}
.fcf.long{font-size:44px}
.fcb{font-size:28px;font-weight:800;color:var(--sakura)}
.fcs{font-size:18px;color:var(--dim)}
.bar{height:6px;border-radius:3px;background:var(--ink3);overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--sakura);border-radius:3px}
.kgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.kc{background:var(--ink2);border:1px solid var(--line);border-radius:12px;padding:8px 0;text-align:center}
.kc b{display:block;font-size:26px;font-weight:600}
.kc span{font-size:11px;color:var(--dim)}
.kc.blank{visibility:hidden}
.kc.weak{border-color:var(--red)}
/* voice overlay */
#voice{position:fixed;inset:0;background:radial-gradient(120% 70% at 50% 28%,#2b2340 0%,#141624 60%,#101119 100%);z-index:50;display:flex;flex-direction:column;padding:calc(10px + var(--safeT)) 16px calc(16px + var(--safeB))}
.vtop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.vtitle{text-align:center;flex:1}
.vtitle b{display:block;font-size:17px}
.vtitle small{color:var(--dim);font-size:12.5px}
.seg{display:flex;background:#ffffff10;border-radius:14px;padding:3px}
.seg button{min-width:44px;min-height:38px;border-radius:11px;font-size:14px;font-weight:800;color:var(--dim);padding:0 8px}
.seg button.on{background:var(--text);color:var(--ink)}
.orbwrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:22px 0 6px}
.orbwrap>*{flex-shrink:0}
.orbwrap.compact{justify-content:flex-start;gap:12px;padding-top:6px}
.orbwrap.compact .orb{width:110px;height:110px;font-size:42px}
.orb{width:170px;height:170px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe3ee,var(--sakura) 45%,var(--sakura2));box-shadow:0 0 0 14px #f4a3c014,0 0 90px #f4a3c050;display:flex;align-items:center;justify-content:center;font-size:60px;font-weight:800;color:#3a1828;transition:.3s}
.orb.listening{animation:breathe 1.1s infinite;box-shadow:0 0 0 16px #f27c7c1c,0 0 100px #f27c7c80;background:radial-gradient(circle at 35% 30%,#ffe6e6,#f27c7c 50%,#c24f5f)}
.orb.thinking{animation:spin 2.4s linear infinite;opacity:.8}
.orb.speaking{animation:talk .45s infinite alternate}
.vstat{font-size:14px;color:var(--dim);font-weight:700;letter-spacing:.02em}

/* ===== Look v2: calmer colours, grouped lists instead of boxes ===== */
:root{
  --ink:#0f1117; --ink2:#181b24; --ink3:#232733; --line:rgba(255,255,255,.07);
  --text:#f2f3f7; --dim:#8c92a6; --sakura:#ff9fc0; --sakura2:#e5789f;
  --matcha:#8bd69b; --sky:#86b8ff; --gold:#f4c46c; --red:#ff7f88; --lav:#b8a6ff; --teal:#6fd4c6;
}
html,body{background:var(--ink)}
#app{background:radial-gradient(120% 45% at 50% -8%,#2a1d33 0%,rgba(15,17,23,0) 70%),var(--ink)}
.pad{padding:20px 16px 36px}

.pagesub{margin:2px 2px 4px}
.sec{font-size:12px;font-weight:800;color:var(--dim);text-transform:uppercase;letter-spacing:.07em;margin:28px 6px 10px}
.sub{color:var(--dim)}
/* surfaces: no outlines, soft fills */
.card,.tile,.tmain,.bdg,.fcin,.qcard,.gopt,.opt,.kc,.pill,.chip,.mini,.btn.ghost,.field,.inputbar,.ubanner,#unitHead,.qzrev,.ptxt{border-color:transparent}
.card{background:var(--ink2);border-radius:20px}
.btn{border-radius:16px;box-shadow:0 6px 20px rgba(229,120,159,.18)}
.btn.ghost{background:var(--ink3);box-shadow:none}
.btn.ghost[data-ok="0"]{color:var(--red)}.btn.ghost[data-ok="1"]{color:var(--matcha)}
.chip{background:var(--ink3)}
.chip.on{background:color-mix(in srgb,var(--sakura) 20%,var(--ink2));color:var(--sakura)}
.mini{background:var(--ink3)}
.mini.ok{background:color-mix(in srgb,var(--matcha) 16%,var(--ink2));color:var(--matcha)}
.field{background:var(--ink3);border:1.5px solid transparent}
.field:focus{border-color:color-mix(in srgb,var(--sakura) 60%,transparent)}
.inputbar{background:var(--ink2);border:1.5px solid transparent}
.inputbar:focus-within{border-color:color-mix(in srgb,var(--sakura) 50%,transparent)}
.pill{background:var(--ink2)}
.pill.fire{background:color-mix(in srgb,var(--gold) 14%,var(--ink2));border-color:transparent}
/* rows become grouped lists, like iPhone Settings */
.row{background:var(--ink2);border:none;border-radius:0;margin:0;padding:12px 14px;min-height:62px;position:relative}
.row::after{content:"";position:absolute;left:68px;right:0;top:0;height:1px;background:var(--line)}
.row:first-child,:not(.row)+.row{border-top-left-radius:20px;border-top-right-radius:20px}
.row:first-child::after,:not(.row)+.row::after{display:none}
.row:last-child,.row:has(+ :not(.row)){border-bottom-left-radius:20px;border-bottom-right-radius:20px;margin-bottom:12px}
.row .ri{width:40px;height:40px;border-radius:12px;font-size:19px;background:color-mix(in srgb,var(--rc,var(--lav)) 17%,transparent);color:var(--rc,var(--text))}
.row:nth-child(6n+1){--rc:var(--sakura)}.row:nth-child(6n+2){--rc:var(--sky)}.row:nth-child(6n+3){--rc:var(--matcha)}
.row:nth-child(6n+4){--rc:var(--gold)}.row:nth-child(6n+5){--rc:var(--lav)}.row:nth-child(6n){--rc:var(--teal)}

/* ===== Look v3: friendly and chunky like Duolingo (both themes) ===== */
:root{--lip:rgba(0,0,0,.35);--sakuraLip:color-mix(in srgb,var(--sakura2) 72%,#000);--edge:var(--ink3)}
html,body,button,input,textarea,select{font-family:"Nunito",-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif}
body{font-weight:600;-webkit-font-smoothing:antialiased}
b,strong{font-weight:800}
.h1{font-size:30px;font-weight:900;letter-spacing:-.02em}
.h2{font-weight:900}
.sub{font-weight:600;line-height:1.5;text-wrap:pretty}
.sec{text-transform:none;letter-spacing:-.01em;font-size:18px;font-weight:900;color:var(--text);margin:28px 4px 12px}
button{transition:transform .12s ease,box-shadow .12s ease,background-color .2s,border-color .2s}
button:focus-visible{outline:3px solid color-mix(in srgb,var(--sky) 70%,transparent);outline-offset:2px}
/* buttons with a "lip" that presses down */
.btn{border-radius:16px;font-weight:900;font-size:16px;letter-spacing:.01em;padding:14px 16px;background:var(--sakura);box-shadow:0 4px 0 var(--sakuraLip)}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--sakuraLip)}
.btn.ghost{background:var(--ink2);color:var(--text);border:2px solid var(--edge);box-shadow:0 4px 0 var(--edge)}
.btn.ghost:active{box-shadow:0 0 0 var(--edge)}
.btn.sm{padding:10px 12px;font-size:15px}
.mini{border:2px solid var(--edge);background:var(--ink2);box-shadow:0 3px 0 var(--edge);font-weight:800;border-radius:12px}
.mini:active{transform:translateY(3px);box-shadow:none}
.mini.ok{background:var(--matcha);border-color:transparent;color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--matcha) 70%,#000)}
.chip{border:2px solid var(--edge);background:var(--ink2);font-weight:800;border-radius:14px}
.chip.on{border-color:var(--sky);background:color-mix(in srgb,var(--sky) 14%,var(--ink2));color:var(--sky)}
.field,.inputbar{border:2px solid var(--edge);background:var(--ink2);border-radius:16px}
.field:focus,.inputbar:focus-within{border-color:var(--sky)}
.send{box-shadow:0 3px 0 var(--sakuraLip)}.send:active{transform:translateY(3px);box-shadow:none}
/* lists: one rounded group with an outline and a lip at the bottom */
.row{border:2px solid var(--edge);border-top-width:0;background:var(--ink2)}
.row:first-child,:not(.row)+.row{border-top-width:2px}
.row:last-child,.row:has(+ :not(.row)){border-bottom-width:4px}
.row::after{left:66px;background:var(--edge)}
.row:active{transform:none;background:color-mix(in srgb,var(--sky) 6%,var(--ink2))}
.row .ri{border-radius:14px;font-size:20px}
.row .rt b{font-weight:800}
.card{background:var(--ink2);border:2px solid var(--edge);border-radius:20px}
.tile{border:2px solid var(--edge);border-bottom-width:4px;background:var(--ink2)}
.tile:active{transform:translateY(2px);border-bottom-width:2px}
.tile .ico{border-radius:14px}
.opt{border:2px solid var(--edge);border-bottom-width:4px;background:var(--ink2);border-radius:16px}
.opt:active{transform:translateY(2px);border-bottom-width:2px}
.opt.right{border-color:var(--matcha)}.opt.wrong{border-color:var(--red)}
.gopt{border:2px solid var(--edge);border-bottom-width:4px;background:var(--ink2)}
.gopt.on{border-color:var(--sakura)}
.kc{border:2px solid var(--edge);border-bottom-width:4px;background:var(--ink2)}
.kc:active{transform:translateY(2px);border-bottom-width:2px}
.fcin{border:2px solid var(--edge);border-bottom-width:6px;box-shadow:none;background:var(--ink2)}
.bdg{border:2px solid var(--edge);border-bottom-width:4px}
.tmain{border:2px solid var(--edge);border-bottom-width:4px;background:var(--ink2)}
.tdue{border:2px solid color-mix(in srgb,var(--sakura) 40%,transparent);border-bottom-width:4px}
/* thick progress bars with a shine */
.bar{height:14px;border-radius:8px;background:var(--ink3)}
.bar i{border-radius:8px;background:var(--matcha);position:relative}
.bar i::after{content:"";position:absolute;left:7px;right:7px;top:3px;height:4px;border-radius:2px;background:rgba(255,255,255,.35)}
/* path: round, chunky lesson bubbles */
#main .node,#main .node:not(.cur):not(.star){width:78px;height:72px;border-radius:50%;background:var(--uc);color:#fff;font-size:32px;box-shadow:0 7px 0 color-mix(in srgb,var(--uc) 68%,#000)}
#main .node.todo{background:var(--ink3);box-shadow:0 7px 0 color-mix(in srgb,var(--ink3) 78%,#000);opacity:1;filter:grayscale(1) opacity(.75)}
#main .node.cur{background:var(--uc);box-shadow:0 7px 0 color-mix(in srgb,var(--uc) 68%,#000),0 0 0 9px color-mix(in srgb,var(--uc) 20%,transparent);animation:bob 2s ease-in-out infinite}
#main .node:active{transform:translateY(5px);box-shadow:0 2px 0 color-mix(in srgb,var(--uc) 68%,#000)}
#main .node.star{background:var(--gold);box-shadow:0 7px 0 color-mix(in srgb,var(--gold) 68%,#000);color:#fff}
#main .node .bd{width:30px;height:30px;font-size:15px;right:-6px;bottom:-4px;background:var(--gold);color:#fff;border:3px solid var(--ink)}
.nlab{font-weight:700}.nwrap.cur .nlab{font-weight:900}
.tip{background:var(--ink2);color:var(--uc,var(--sakura));border:2px solid var(--edge);border-radius:12px;font-weight:900;letter-spacing:.06em}
.tip::after{border-top-color:var(--edge)}
.ubanner{background:var(--uc);border:none;border-radius:18px;box-shadow:0 5px 0 color-mix(in srgb,var(--uc) 68%,#000);color:#fff}
.ubanner .ubt small,.ubanner .ubp{color:rgba(255,255,255,.85)}
.ubanner .ube{background:rgba(255,255,255,.22)}
#unitHead{border:2px solid var(--edge);border-bottom-width:4px;background:color-mix(in srgb,var(--ink2) 92%,transparent)}
.pill{background:transparent;border:none;font-weight:900;padding:0 10px}
.pill.fire{background:transparent;color:var(--gold)}
/* lesson player */
.lpsteps span{background:var(--ink2);border:2px solid var(--edge);font-weight:800}
.lpsteps span.on{background:var(--sky);border-color:var(--sky);color:#fff}
.wcard{border:2px solid var(--edge);border-bottom-width:6px;background:var(--ink2)}
/* chat */
.m.a .bub{background:var(--ink2);border:2px solid var(--edge)}
.bub{border-radius:20px}
/* bottom bar: flat, attached, the open tab outlined */
#tabs{margin:0;border-radius:0;border:none;border-top:2px solid var(--edge);background:var(--ink2);box-shadow:none;padding:6px 8px calc(6px + var(--safeB));-webkit-backdrop-filter:none;backdrop-filter:none;gap:4px}
#tabs button{font-size:11px;font-weight:800;border-radius:14px;min-height:54px}
#tabs button .ti{font-size:24px}
#tabs button.on{background:color-mix(in srgb,var(--sky) 12%,transparent);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--sky) 65%,transparent);color:var(--sky)}
#sheet .sh{background:var(--ink2)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

/* ===== Light theme ("washi"): warm paper white, sakura, indigo, matcha, yuzu ===== */
html.light{color-scheme:light;
  --ink:#faf7f2;--ink2:#ffffff;--ink3:#f1ebe3;--line:#ebe4db;--edge:#e6dfd6;
  --text:#2c2731;--dim:#857d8a;--sakura:#ec5f87;--sakura2:#d9466f;--matcha:#4fae42;--sky:#3487dc;--gold:#e9a120;--red:#e5484d;--lav:#9466dc;--teal:#1fa596}
html.light,html.light body{background:var(--ink)}
html.light #app{background:radial-gradient(130% 40% at 50% -10%,#ffe4ec 0%,rgba(250,247,242,0) 70%),var(--ink)}
html.light #app::before{content:"";position:fixed;top:0;left:0;right:0;height:var(--safeT);background:var(--sakura2);z-index:40}
html.light .btn,html.light .send,html.light .av,html.light .iconbtn.call,html.light .play,html.light .node.cur{color:#fff}
html.light .btn.ghost{color:var(--text)}
html.light .iconbtn{background:var(--ink3)}
html.light .iconbtn.call{background:linear-gradient(140deg,var(--sakura),var(--sakura2));box-shadow:0 3px 0 var(--sakuraLip)}
html.light .inputbar .iconbtn{background:transparent}
html.light .iconbtn.live{background:#fde8ec}
html.light .opt.right{background:#ebf7e7}html.light .opt.wrong{background:#fdeced}
html.light .tg{background:var(--ink3)}html.light .tg.w{background:#fde6ec;color:#b8395c}html.light .tg.s{background:#e6f5e2;color:#3b8a30}
html.light .m.u .bub{background:var(--sakura);color:#fff}
html.light .m.u .bub a{color:#fff}
html.light .fix{background:#fff3f6;border:2px solid #f6d2dc}html.light .fix.ok{background:#eff8ec;border-color:#cfe7c5}
html.light .fw{color:#b07400}
html.light .err{background:#fdeced;border:2px solid #f5c6c8;color:#7c2427}
html.light .hero,html.light .mehead{background:linear-gradient(135deg,#ffe2ea 0%,#fff1e4 100%);border:2px solid #f7d6de;border-bottom-width:4px}
html.light .wod{background:linear-gradient(135deg,#e5f0ff 0%,#f5f9ff 100%);border:2px solid #d3e3f7;border-bottom-width:4px}
html.light .wod .iconbtn{background:#fff}
html.light .donecard{background:#ebf7e7;border:2px solid #bfe2b3}
html.light .donecard span{color:#4e6b47}
html.light .bdg.on{background:#fff5df;border-color:#f1d9a3}
html.light .tdue{background:#fff0f4}
html.light .tchip{background:var(--ink2);border:2px solid var(--edge)}html.light .tchip.ok{background:#ebf7e7;border-color:var(--matcha);color:#3b8a30}
html.light .cd{background:var(--ink3)}html.light .cd.l3{color:#fff}html.light .cd i.dot{background:#fff}
html.light .stat,html.light .wb{background:var(--ink3)}
html.light .chathead,html.light .tbar{background:color-mix(in srgb,var(--ink2) 70%,transparent);border-bottom:2px solid var(--edge)}
html.light #sheet{background:rgba(44,39,49,.35)}
html.light #sheet .sh::before{background:#d9d1c7}
html.light .mtag{background:#e8f1fc;color:#2b72bd}html.light .mtag.sp{background:#fde8ee;color:#c23c64}html.light .mtag.ts{background:#fdf1db;color:#a86d00}
html.light .row.done .ri{background:#e6f5e2;color:var(--matcha)}
html.light .qzrev{background:var(--ink2);border:2px solid var(--edge)}
html.light .ptxt{background:var(--ink2);border:2px solid var(--edge)}
html.light #toast{background:#2c2731}
html.light .wjp,html.light .fcf{color:var(--text)}
html.light .trbit{background:var(--ink3)}
/* the call screen stays dark in both themes */
html.light #voice{--ink:#0f1117;--ink2:#181b24;--ink3:#232733;--line:rgba(255,255,255,.07);--edge:#2a2e3b;--text:#f2f3f7;--dim:#9aa0b6;--sakura:#ff9fc0;--sakura2:#e5789f;--matcha:#8bd69b;--sky:#86b8ff;--gold:#f4c46c;--red:#ff7f88;color:var(--text)}
html.light #voice .donecard{background:linear-gradient(140deg,#20372a,#181b24);border:none}
html.light #voice .donecard span{color:var(--dim)}
html.light #voice .btn{color:#2a1520}

/* translator, big and clean */
.tx-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.tx-on{font-size:13px;font-weight:800;color:var(--matcha);background:color-mix(in srgb,var(--matcha) 12%,transparent);padding:5px 10px;border-radius:999px}.tx-on.off{color:var(--dim);background:var(--ink3)}
.tx-langs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:var(--ink2);border:2px solid var(--edge);border-radius:18px;padding:6px;margin-bottom:12px}
.tx-langs span{text-align:center;font-weight:900;font-size:17px;padding:8px 0}
.tx-swap{width:48px;height:44px;border-radius:14px;background:color-mix(in srgb,var(--sky) 14%,transparent);color:var(--sky);font-size:22px;font-weight:900}
.tx-in{background:var(--ink2);border:2px solid var(--edge);border-bottom-width:4px;border-radius:22px;padding:14px 14px 10px}
.tx-in:focus-within{border-color:var(--sky)}
.tx-in textarea{width:100%;min-height:96px;border:none;outline:none;background:transparent;resize:none;font-size:22px;font-weight:700;line-height:1.35;color:var(--text);font-family:inherit}
.tx-in.has textarea{min-height:0;font-size:19px}.tx-in.has .tx-mic{width:58px;height:58px;font-size:24px}.tx-in.has .tx-go{width:50px;height:50px}
.tx-inbar{display:grid;grid-template-columns:44px 1fr 56px;align-items:center;gap:8px;margin-top:6px}
.tx-mic{justify-self:center;width:72px;height:72px;border-radius:50%;background:var(--sakura);color:#fff;font-size:30px;box-shadow:0 5px 0 var(--sakuraLip)}
.tx-mic:active{transform:translateY(5px);box-shadow:none}
.tx-mic.live{background:var(--red);animation:throb 1.2s infinite}
.tx-go{width:56px;height:56px;border-radius:18px;background:var(--sky);color:#fff;font-size:26px;font-weight:900;box-shadow:0 4px 0 color-mix(in srgb,var(--sky) 70%,#000)}
.tx-go:active{transform:translateY(4px);box-shadow:none}
.tx-ic{width:44px;height:44px;border-radius:14px;background:var(--ink3);font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tx-busy{text-align:center;color:var(--dim);font-weight:800;margin:16px 0}
.tx-out{margin-top:14px;background:var(--ink2);border:2px solid var(--edge);border-bottom-width:4px;border-radius:22px;padding:22px 18px 16px;text-align:center}
.tx-big{font-size:34px;font-weight:900;line-height:1.35;word-break:break-word}.tx-big.tx-en{font-size:28px}
.tx-ro{color:var(--sky);font-weight:800;font-size:17px;margin-top:8px}
.tx-kj{color:var(--dim);font-size:16px;margin-top:6px}
.tx-note{font-size:13px;color:var(--dim);margin-top:10px}
.tx-acts{display:flex;gap:8px;margin-top:16px}.tx-acts .tx-play{flex:1}.tx-acts .tx-ic{width:54px;height:auto;border-radius:16px;font-size:22px}
.tx-words{margin-top:12px;text-align:left}.tx-words summary{min-height:44px;display:flex;align-items:center;justify-content:center;color:var(--dim);font-weight:800;list-style:none}.tx-words summary::-webkit-details-marker{display:none}
.tx-src{font-size:11.5px;color:var(--dim);margin-top:8px}
.tx-miss{text-align:left}
.tx-alt-h{font-size:14px;font-weight:900;color:var(--dim);margin:20px 4px 8px}
.tx-foot{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:22px}
.tx-foot button{min-height:36px;padding:0 12px;border-radius:999px;background:var(--ink3);color:var(--dim);font-size:12.5px;font-weight:800}
.tx-foot button[disabled]{opacity:.5}
@keyframes dot{0%,80%,100%{opacity:.25}40%{opacity:1}}
@keyframes throb{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes talk{from{transform:scale(1)}to{transform:scale(1.05)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  a=String(a||"").replace(/\s+/g," ").trim();b=String(b||"").replace(/\s+/g," ").trim();
  if(!a)return b;if(!b)return a;
  const la=a.toLowerCase(),lb=b.toLowerCase();
  if(lb.startsWith(la))return b;                    // the new piece already contains everything so far
  if(la.endsWith(lb)||(lb.length>=4&&la.includes(lb)))return a;   // a repeat
  let k=Math.min(a.length,b.length);for(;k>=3;k--){if(la.endsWith(lb.slice(0,k)))break;}
  if(k>=3)return a+b.slice(k);                      // overlapping end/start
  const lw=la.split(" ").pop(),fw=lb.split(" ")[0];if(lw&&lw===fw&&/^[a-z']+$/.test(lw))return a+b.slice(fw.length);   // "…to" + "to go…"
  return a+(JA_END.test(a)&&JA_END.test(b[0])?"":" ")+b;

function styleRules(){

// Calls are quick back-and-forths, so they send at most 6 recent messages (the lesson itself is in the memory part)
function buildMessages(mode){

// One place that talks to the Anthropic API. With no key saved, it sends no auth

const FAST_MODEL="claude-haiku-4-5-20251001";

const PRICE={"claude-haiku-4-5-20251001":[1,5],"claude-sonnet-5-5":[2,10]};
function noteUsage(model,u){

  if(U.month!==m){U.month=m;U.cost=0;U.n=0;}

const usd=x=>"$"+(x<0.1?x.toFixed(3):x.toFixed(2));
async function apiRequest(body,cheap){
  const key=S.settings.apiKey.trim();
  const headers={"Content-Type":"application/json"};
  let model="claude-sonnet-4-6";
  body={...body};
  if(key){headers["x-api-key"]=key;headers["anthropic-version"]="2023-06-01";headers["anthropic-dangerous-direct-browser-access"]="true";model=cheap?FAST_MODEL:S.settings.model;}
  const smart=key&&model==="claude-sonnet-5-5";

    // Room is added to max_tokens because thinking counts toward it (you only pay for what's used).
    body.output_config={effort:"low"};body.max_tokens+=1500;
    // If Sonnet declines a message, the API retries it on a fallback model instead of failing.
    headers["anthropic-beta"]="server-side-fallback-2026-07-01";body.fallbacks="default";
  }
  // 60 s limit: a stuck connection gives a clear error instead of "thinking" forever
  const go=async(h,b)=>{const ac=window.AbortController?new AbortController():null,tm=setTimeout(()=>ac&&ac.abort(),60000);
    try{const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:h,body:JSON.stringify({model,...b}),signal:ac?ac.signal:undefined});let data=null;try{data=await res.json();}catch(e){}return{res,data};}
    catch(e){throw new Error(e&&e.name==="AbortError"?"no answer after 60 seconds":(e&&e.message)||"network error");}
    finally{clearTimeout(tm);}};
  let {res,data}=await go(headers,body);
  if(smart&&res.status===400&&data&&data.error&&/fallback|beta/i.test(data.error.message||"")){
    const h={...headers};delete h["anthropic-beta"];const b={...body};delete b.fallbacks;({res,data}=await go(h,b));
  }
  if(!res.ok||!data||data.error){const msg=(data&&data.error&&data.error.message)||("HTTP "+res.status);const err=new Error(msg);err.status=res.status;throw err;}
  noteUsage(model,data.usage);
  if(data.stop_reason==="refusal"){const err=new Error("refusal");err.refusal=true;throw err;}
  return (data.content||[]).filter(b=>b.type==="text").map(b=>b.text||"").join("").trim();
}
// Calls always use the fast, cheap model (short spoken replies don't need the Smart one)

const isoDay=d=>{d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
function ensurePlan(){if(!S.plan){S.plan={start:isoDay(),done:{},custom:[]};save();}return S.plan;}
const doneMap=()=>S.plan?S.plan.done:{};
const isN5Path=()=>S.level==="n5";

const UCOL_L={"#f4a3c0":"#ec5f87","#7cb8f4":"#3d8fe0","#f2c36b":"#f0a92b","#9fd67c":"#58b84a","#c59cf4":"#9b6ce0"};

  document.documentElement.classList.toggle("light",light);const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=light?"#faf7f2":"#0f1117";}
function pathUnits(){

  return(CUR[S.level]||[]).map(([u],i)=>({title:LV[S.level].label+" · Unit "+(i+1),sub:u,e:"📘",c:ucol(UCOL[i%5])}));
}
function pathNodes(){
  let nodes=[];
  if(isN5Path())COURSE.forEach((u,ui)=>{
    const [a,b,c]=u.ls;
    nodes.push({key:"cl:"+a.id,t:"CL",k:a.id,unit:ui},{key:"cl:"+b.id,t:"CL",k:b.id,unit:ui},{key:"cq:"+ui+":m",t:"CQ",k:"m",unit:ui},{key:"ck:"+ui,t:"CK",k:u.kana,unit:ui},{key:"cl:"+c.id,t:"CL",k:c.id,unit:ui},{key:"cr:"+ui,t:"CR",k:ui,unit:ui},{key:"cq:"+ui+":t",t:"CQ",k:"t",unit:ui});
    if(ui%3===2)nodes.push({key:"cq:"+ui+":r",t:"CQ",k:"r",unit:ui});
  });
  else(CUR[S.level]||[]).forEach(([u,ls],ui)=>{ls.forEach(l=>nodes.push({key:"L:"+l[0],t:"L",k:l[0],unit:ui}));nodes.push({key:S.level+":"+ui+":q",t:"Q",k:"unit",unit:ui},{key:S.level+":"+ui+":c",t:"CQ",k:"c",unit:ui});});
  if(isN5Path())nodes.push({key:"cq:final",t:"CQ",k:"f",unit:COURSE.length-1});
  const custom=S.plan?S.plan.custom.filter(c=>!c.level||c.level===S.level):[];
  if(custom.length){
    const firstOpen=nodes.find(n=>!nodeDone(n));
    custom.forEach(c=>{
      let at=nodes.findIndex(n=>n.key===c.before);
      if(at<0){const f=firstOpen?nodes.findIndex(n=>n.key===firstOpen.key):-1;at=f>=0?f:nodes.length;}
      const unit=nodes[at]?nodes[at].unit:(nodes.length?nodes[nodes.length-1].unit:0);
      nodes.splice(at,0,{key:"c:"+c.id,t:"X",k:c.id,title:c.title,unit});
    });
  }
  return nodes;
}
function nodeDone(n){return !!doneMap()[n.key]||(n.t==="L"&&S.done.includes(n.k));}

function bumpWord(id,ok){
  const c=S.cards[id]||{box:0,due:0};
  if(ok){c.box=Math.min(c.box+1,6);c.due=Date.now()+INT[c.box];}else{c.box=0;c.due=Date.now();}
  S.cards[id]=c;
}
// Older course words that are due (or weakest), for review questions and for Yuki to ask about
function reviewWords(exclude,n){
  const now=Date.now(),ex=new Set(exclude||[]);
  return Object.keys(S.cards).filter(i=>i.startsWith("w:")&&!ex.has(i.slice(2)))
    .sort((a,b)=>((S.cards[a].due<=now?0:1)-(S.cards[b].due<=now?0:1))||(S.cards[a].box-S.cards[b].box))
    .slice(0,n).map(i=>i.slice(2));
}

function buildQuiz(lp){

// Spot target words in what you typed (Japanese or romaji)
const kataHira=t=>t.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
const normJ=t=>kataHira(String(t)).replace(/[～~\s、。！？!?,.「」・ー-]/g,"").toLowerCase();
const normR=t=>String(t).toLowerCase().replace(/[āâ]/g,"a").replace(/[ūû]/g,"u").replace(/[ōô]/g,"o").replace(/[ēê]/g,"e").replace(/[īî]/g,"i").replace(/[^a-z]/g,"").replace(/ou/g,"o").replace(/oo/g,"o").replace(/uu/g,"u").replace(/aa/g,"a").replace(/ee/g,"e").replace(/wa/g,"ha");
// Voice typing in English mode turns Japanese into look-alikes ("Ohio" for ohayou). Compare by sound.
function soundKey(t){return normR(t).replace(/h/g,"").replace(/y/g,"i").replace(/w/g,"").replace(/(.)\1+/g,"$1").replace(/[ou]$/,"o");}
function editDist(a,b){const d=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t;}}return d[b.length];}
// Everyday English words never count as a Japanese word on their own ("to", "go", "want to"…)
const EN_COMMON=new Set("a an the i you he she it we they me him her us them my your our their this that these those is am are was were be been do does did have has had will would can could should shall may might must not no yes ok okay oh hi hey hello and or but so if then than to too of in on at by for from with about as into onto up down out over again how what when where why who which there here now today tomorrow yesterday very really just also want wanna like love go going went come say said see look know think get got make made take give tell ask please thanks thank sorry fine good great nice well bad more much many some any all one two three four five six seven eight nine ten time day night morning evening week weekend music movie movies game games eat drink sleep yeah cool wow".split(" "));
function soundsLike(text,romaji){
  const target=soundKey(romaji);if(target.length<4)return false;
  const words=String(text).toLowerCase().split(/[^a-z']+/).filter(Boolean);
  const n=romaji.trim().split(/\s+/).length;
  for(let i=0;i<words.length;i++)for(let k=1;k<=Math.min(3,n+1);k++){
    const span=words.slice(i,i+k);if(span.length<k||span.every(w=>EN_COMMON.has(w.replace(/'.*/,""))))continue;
    const cand=soundKey(span.join(""));if(!cand)continue;
    if(editDist(cand,target)<=(target.length>=8?2:1))return true;}
  return false;
}
// iPhone's Japanese voice typing writes numbers as digits ("1" for いち) and many words in kanji
// (元気 for げんき). Turn digits back into Japanese and accept the kanji spellings of course words.
const JNUM=["ゼロ","いち","に","さん","よん","ご","ろく","なな","はち","きゅう"];
function numToKana(n){if(n<10)return JNUM[n];if(n<100){const t=Math.floor(n/10),o=n%10;return(t>1?JNUM[t]:"")+"じゅう"+(o?JNUM[o]:"");}
  if(n<1000){const h=Math.floor(n/100),r=n%100;return({1:"ひゃく",3:"さんびゃく",6:"ろっぴゃく",8:"はっぴゃく"}[h]||JNUM[h]+"ひゃく")+(r?numToKana(r):"");}return String(n);}
function jaNum(n){
  if(!n)return"ゼロ";let out="";
  const man=Math.floor(n/10000);if(man){out+=(man===1?"いち":jaNum(man))+"まん";n%=10000;}
  const sen=Math.floor(n/1000);if(sen){out+={1:"せん",3:"さんぜん",8:"はっせん"}[sen]||JNUM[sen]+"せん";n%=1000;}

}

// Whole input (may be several sentences) → [{ja, say, en, chunks, guess}]
function composeEn(text){
  const parts=String(text).split(/[.?!;。？！]+|\s(?:and then|then)\s/i).map(x=>x.trim()).filter(Boolean);if(!parts.length)return null;
  const all=[],guess=[];

    const pre=[],post=[];
    t=t.replace(/^(excuse me|sorry|pardon me|hello|hi|hey|good morning|good evening)( sir| madam)? /,(m,w)=>{const f=TR_FIX.find(x=>x[1].split("|").includes(w));if(f)pre.push(C(f[2].replace(/。$/,"、"),f[3].replace(/。$/,"、"),w));return"";});
    t=t.replace(/ (thank you|thanks)( very much)?$/,()=>{post.push(C("ありがとうございます。","","thank you"));return"";});
    let please=false;t=t.replace(/^please /,()=>{please=true;return"";}).replace(/ please$/,()=>{please=true;return"";}).trim();
    if(!t){all.push(...pre.map(c=>({...c,k:c.k.replace(/、$/,"。"),j:c.j.replace(/、$/,"。")})),...post);continue;}
    const fx=TR_FIX.find(f=>f[1].split("|").includes(t)||(please&&f[1].split("|").includes(t+" please")));
    let ch=fx?[C(fx[2],fx[3],t)]:trxSentence(t,{raw});
    if(!ch)ch=trxSplit(t,raw);
    if(!ch){const gl=[],caps=new Set(raw.split(/\s+/).slice(1).filter(x=>/^[A-Z]/.test(x)&&x!=="I").map(x=>x.toLowerCase().replace(/[^a-z'\-]/g,"")));
      ch=trxSentence(t,{raw,guess:true,gl,caps});if(!ch)return null;guess.push(...gl);}
    all.push(...pre,...ch,...post);
  }
  if(!all.length)return null;
  const ja=all.map(c=>c.k).join(" ").replace(/ +/g," ").replace(/、 /g,"、").trim();
  const say=all.map(c=>c.j).join(" ").replace(/\s+/g," ").replace(/ (?![A-Za-z])|(?<![A-Za-z]) /g,"");
  const en=String(text).trim().replace(/\s+/g," ").replace(/^\w/,c=>c.toUpperCase()).replace(/\bi\b/g,"I").replace(/([^.?!])$/,(m,c)=>c+(/^(where|what|when|how|who|which|why|is|are|do|does|did|can|could|would|will|may)\b/i.test(String(text).trim())?"?":"."));
  return{ja,say,en,chunks:all.filter(c=>c.k),guess};
}

// Best answers for what was said: the sentence builder first, then the word patterns and phrasebook

  const res=[],seen=new Set(),push=r=>{if(r&&r.ja&&!seen.has(r.ja)){seen.add(r.ja);res.push(r);}};

function trBankSave(){clearTimeout(trbT);trbT=setTimeout(()=>{try{localStorage.setItem(TRB_KEY,JSON.stringify(trBank().slice(-TRB_MAX)));}catch(e){TRB.splice(0,500);}},500);}
const JA_RE=/[ぁ-んァ-ヶ一-龯々]/;
const trJaKey=t=>String(t).replace(/[\s「」『』（）()、。！？!?.,…~〜ー*_]/g,"");
const trEnKey=t=>String(t).toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9' ]+/g," ").replace(/\s+/g," ").trim();
function trBankAdd(ja,en,src,ro){
  ja=String(ja||"").replace(/\s+/g," ").replace(/^[「『\s]+|[」』\s]+$/g,"").trim();en=String(en||"").replace(/\s+/g," ").trim();
  if(!JA_RE.test(ja)||ja.length<2||ja.length>160||en.length>200||/[A-Za-z]{3,}/.test(ja))return;
  if(en&&(JA_RE.test(en)||!/[a-z]/i.test(en)))en="";
  const b=trBank(),k=trJaKey(ja),i=b.findIndex(x=>trJaKey(x.ja)===k);
  if(i>=0){const x=b[i];if(en&&(!x.en||src!=="yuki"))x.en=en,x.src=src;if(ro)x.ro=ro;x.at=Date.now();x.n=(x.n||1)+1;b.splice(i,1);b.push(x);}
  else b.push(ro?{ja,en,src,ro,at:Date.now(),n:1}:{ja,en,src,at:Date.now(),n:1});
  if(b.length>TRB_MAX)b.splice(0,b.length-TRB_MAX);trBankSave();
}
// Looks like romaji rather than English ("konnichiwa", "ohayou gozaimasu")?
const ROMA_W=/^(?:(?:[kgsztdnhbpmyrwfjv]|sh|ch|ts|ky|gy|ny|hy|my|ry|by|py|j)?[aiueo]+|n|[kstpc](?=[kstpc]))+$/;
const trRomaji=t=>{const w=trEnKey(t).split(" ").filter(Boolean);return w.length>0&&w.every(x=>ROMA_W.test(x));};
// Pull Japanese ↔ English pairs out of what Yuki says (costs nothing: it's text that already arrived)
function trHarvest(text,fix){
  if(fix&&fix.ja&&fix.en&&JA_RE.test(fix.ja))trBankAdd(fix.ja,fix.en,"fix");
  const t=String(text||"").replace(/\*\*|__|`/g,"").replace(/\[\[|\]\]/g,"").replace(/(^|\s)\*([^*\n]+)\*/g,"$1$2");
  const J="[ぁ-んァ-ヶ一-龯々ー〜、0-9０-９・ 　]";
  const used=new Set();
  t.split(/\n+/).forEach(line=>{
    line=line.replace(/^\s*(?:[-•▪︎·]|\d+[.)])\s*/,"").trim();if(!JA_RE.test(line))return;
    // 日本語 (romaji) – English   /   日本語 (English)   /   日本語 = English   /   日本語: English
    const re=new RegExp("("+J+"*[ぁ-んァ-ヶ一-龯々]"+J+"*[。！？!?]?)\\s*(?:[(（]([^()（）]{1,60})[)）])?\\s*(?:[-–—=:→]+\\s*([A-Za-z][^\\n()（）]{1,120}?)(?=$|\\s[-–—]\\s|[;|]|\\s{2}|[ぁ-んァ-ヶ一-龯]))?","g");
    let m;while((m=re.exec(line))){
      const ja=m[1].trim(),br=(m[2]||"").trim();let en=(m[3]||"").trim().replace(/[\s,;:–—-]+$/,"");
      if(!en&&br&&/[a-z]/i.test(br)&&!trRomaji(br))en=br;
      if(ja.replace(/[\s、。！？!?]/g,"").length<2)continue;
      if(en)en=en.replace(/^["“']|["”']$/g,"").replace(/\s*\(.*$/,"");
      used.add(trJaKey(ja));trBankAdd(ja,en,en?"yuki-en":"yuki");}
  });
  // every Japanese sentence Yuki says, even without English (filled in later for free when online)
  (t.match(/[^。！？!?\n]*[ぁ-んァ-ヶ一-龯][^。！？!?\n]*[。！？!?]?/g)||[]).forEach(s=>{
    const ja=(s.match(new RegExp(J+"+[。！？!?]?","g"))||[]).filter(x=>JA_RE.test(x)).sort((a,b)=>b.length-a.length)[0];
    if(ja&&!used.has(trJaKey(ja))&&trJaKey(ja).length>=3)trBankAdd(ja.trim(),"","yuki");});
  trFillSoon();
}
// Find a saved sentence: exact match first, then close ones (shared words / shared characters)
function trBankFind(q,dir){
  const b=trBank();if(!b.length)return[];
  if(dir==="ja"){const k=trJaKey(q);if(!k)return[];const bg=s=>{const o=new Set();for(let i=0;i<s.length-1;i++)o.add(s.slice(i,i+2));return o;},qb=bg(k);
    return b.filter(x=>x.en).map(x=>{const xk=trJaKey(x.ja);if(xk===k)return[1,x];const xb=bg(xk);let h=0;qb.forEach(g=>{if(xb.has(g))h++;});return[2*h/((qb.size+xb.size)||1),x];}).filter(r=>r[0]>=0.6).sort((a,b)=>b[0]-a[0]).slice(0,3);}
  const k=trEnKey(q);if(!k)return[];const qw=new Set(k.split(" "));
  return b.filter(x=>x.en).map(x=>{const xk=trEnKey(x.en);if(xk===k)return[1,x];const xw=new Set(xk.split(" "));let h=0;qw.forEach(w=>{if(xw.has(w))h++;});return[h/Math.max(qw.size,xw.size),x];}).filter(r=>r[0]>=0.75).sort((a,b)=>b[0]-a[0]).slice(0,3);
}
// Free online translation. Returns {text, ro} or throws.
async function freeMT(text,sl,tl){
  const go=async(url,parse)=>{const ac=new AbortController(),t=setTimeout(()=>ac.abort(),6000);try{const r=await fetch(url,{signal:ac.signal});if(!r.ok)throw new Error("HTTP "+r.status);return parse(await r.json());}finally{clearTimeout(t);}};
  const q=encodeURIComponent(text);let lastErr;
  for(const [url,parse] of [
    ["https://translate.googleapis.com/translate_a/single?client=gtx&sl="+sl+"&tl="+tl+"&dt=t&dt=rm&q="+q,j=>{const seg=(j&&j[0])||[];const out=seg.filter(s=>s&&typeof s[0]==="string").map(s=>s[0]).join("").trim();
      const tr=seg.find(s=>s&&s[0]==null&&(s[2]||s[3]));if(!out)throw new Error("empty");return{text:out,ro:tl==="ja"&&tr?String(tr[2]||""):""};}],
    ["https://api.mymemory.translated.net/get?langpair="+sl+"|"+tl+"&q="+q,j=>{const out=j&&j.responseData&&j.responseData.translatedText;if(!out||+j.responseStatus!==200||/MYMEMORY WARNING|INVALID/i.test(out))throw new Error("mymemory");
      const d=document.createElement("textarea");d.innerHTML=out;return{text:d.value.trim(),ro:""};}]]){
    try{return await go(url,parse);}catch(e){lastErr=e;vlog&&vlog("✗ translate "+url.split("/")[2]+": "+e.message);}}
  throw lastErr||new Error("offline");
}
// Fill in English for Yuki's sentences in the background, a few at a time, only when online (free)
let trFillT=0,trFillN=0,trFilling=false;
function trFillSoon(ms){clearTimeout(trFillT);trFillT=setTimeout(trFill,ms||15000);}
async function trFill(){
  if(trFilling||navigator.onLine===false||trFillN>=80||document.visibilityState!=="visible")return;
  const todo=trBank().filter(x=>!x.en&&!x.tried).slice(-6);if(!todo.length)return;
  trFilling=true;
  for(const x of todo){x.tried=1;try{const r=await freeMT(x.ja,"ja","en");if(r.text&&!JA_RE.test(r.text)){x.en=r.text;x.src=x.src||"yuki";}trFillN++;}catch(e){break;}await new Promise(r=>setTimeout(r,1500));}
  trBankSave();trFilling=false;if(trBank().some(x=>!x.en&&!x.tried))trFillSoon(30000);
}

let trSeq=0;
const trCapEn=q=>q.trim().replace(/\s+/g," ").replace(/^\w/,c=>c.toUpperCase()).replace(/\bi\b/g,"I");
function trMerge(arr){const seen=new Set(),out=[];arr.forEach(r=>{if(!r)return;const k=r.ja+"|"+r.en;if(seen.has(trJaKey(r.ja))&&r.src!=="online")return;seen.add(trJaKey(r.ja));out.push(r);});return out.slice(0,4);}
async function trRun(q){
  const T=UI.tr||(UI.tr={q:"",res:[],dir:"en"});T.q=q;const my=++trSeq,online=navigator.onLine!==false;
  if(T.dir==="ja"){
    const bank=trBankFind(q,"ja").map(([sc,x])=>({ja:x.ja,en:x.en,src:"chats"}));
    T.res=bank;T.busy=online;rerender();
    if(online){try{const r=await freeMT(q,"ja","en");if(my!==trSeq)return;if(r.text){T.res=trMerge([{ja:q,en:r.text,src:"online"},...bank]);trBankAdd(q,r.text,"mt");}}catch(e){}
      if(my!==trSeq)return;T.busy=false;rerender();}
    if(T.res[0])trSayEn(T.res[0].en);
    return;}
  const local=translateEn(q).map(r=>({...r,src:r.rec?"rec":r.chunks?"built":"phrase"}));
  const bank=trBankFind(q,"en").map(([sc,x])=>({ja:x.ja,say:x.ja,en:x.en,ro:x.ro||(isKana(x.ja)?kanaRomaji(x.ja):""),rec:TR_REC.has(x.ja),src:"chats",exact:sc===1}));
  const exact=bank[0]&&bank[0].exact;
  T.res=trMerge(exact?[bank[0],...local,...bank.slice(1)]:[...local,...bank]);
  const sure=exact||(local[0]&&local[0].rec&&local[0].chunks&&!(local[0].guess||[]).length);
  if(sure||!online){T.busy=false;rerender();if(T.res[0])trSay(T.res[0].ja,T.res[0].say);return;}
  T.busy=true;rerender();
  try{const r=await freeMT(q,"en","ja");if(my!==trSeq)return;
    if(r.text&&JA_RE.test(r.text)){T.res=trMerge([{ja:r.text,say:r.text,en:trCapEn(q),ro:r.ro||(isKana(r.text)?kanaRomaji(r.text):""),rec:TR_REC.has(r.text),src:"online"},...T.res]);trBankAdd(r.text,trCapEn(q),"mt",r.ro);}}catch(e){}
  if(my!==trSeq)return;T.busy=false;rerender();if(T.res[0])trSay(T.res[0].ja,T.res[0].say);
}

async function trSaveOffline(){
  if(!("caches" in window)){toast("Offline saving isn't available here");return;}
  const files=[...new Set([...TR_REC].map(t=>"audio/ryusei/"+recId(t)+".mp3"))];let done=0;
  toast("Saving "+files.length+" sentences… keep the app open",2500);
  const c=await caches.open("yuki-audio");
  for(let i=0;i<files.length;i+=8){await Promise.all(files.slice(i,i+8).map(async f=>{try{if(!(await c.match(f))){const r=await fetch(f);if(r.ok)await c.put(f,r);}done++;}catch(e){}}));}
  try{const r=await fetch(location.pathname,{cache:"no-store"});if(r.ok)await (await caches.open("yuki-page")).put("./",r);}catch(e){}
  UI.tr.saved=done;toast(done===files.length?"✓ Saved! The translator now works offline":"Saved "+done+" of "+files.length+" (try again on Wi-Fi for the rest)",3500);if(UI.tab==="translate")rerender();
}

/* ---- Multiple-choice quiz from the cards you've learned: no audio, no reading until you answer ---- */
const cardKind=id=>/^[hk]:/.test(id)?"kana":id.startsWith("j:")?"kanji":id.startsWith("n:")?"num":"word";
const firstReading=c=>String(c.sub||"").split(/[・,、/]/)[0].replace(/[()（）]/g,"").trim();
function buildQz(kind){
  if(kind==="nums")kind="num";
  const learned=Object.keys(S.cards).filter(i=>CARDS[i]&&(kind==="all"||cardKind(i)===kind));
  if(!learned.length)return null;
  const pick=shuffle(learned.slice()).sort((a,b)=>(S.cards[a].due<=Date.now()?0:1)-(S.cards[b].due<=Date.now()?0:1)).slice(0,10);
  return shuffle(pick).map(id=>makeQ(id,false));
}
// One multiple-choice question for a card. "listen" (tests only): you hear it and pick the meaning.
function makeQ(id,listen){
  const c=CARDS[id],k=cardKind(id),P=Object.keys(CARDS).filter(i=>cardKind(i)===k);
  const types=k==="kana"?["sound","kana"]:k==="kanji"&&firstReading(c)?["meaning","reading"]:["meaning","word"];
  if(listen&&k!=="kanji"&&RECORDED.has(c.say))types.push("listen");
  const type=types[Math.floor(Math.random()*types.length)];
  const val={sound:x=>CARDS[x].back,kana:x=>CARDS[x].front,meaning:x=>CARDS[x].back,word:x=>CARDS[x].front,reading:x=>firstReading(CARDS[x]),listen:x=>k==="num"?CARDS[x].front:CARDS[x].back}[type];
  const answer=val(id),others=[...new Set(shuffle(P.filter(x=>x!==id)).map(val).filter(v=>v&&v!==answer))].slice(0,3);
  const prompt=type==="listen"?"":type==="kana"||type==="word"?c.back:c.front;
  const ask=k==="num"?{meaning:"How do you say this number?",word:"Which number is this?",listen:"👂 Which number did you hear?"}[type]:{sound:"What sound is this?",kana:"Which character is this sound?",meaning:"What does this mean?",word:"How do you say this in Japanese?",reading:"How is this kanji read?",listen:"👂 Listen: what did you hear?"}[type];
  return{id,type,prompt,answer,ask,opts:shuffle([answer,...others])};
}

function numMax(){
  const k=new Set(Object.keys(S.cards).filter(i=>i.startsWith("n:")));
  if(k.has("n:10000"))return 99999;if(k.has("n:1000"))return 9999;if(k.has("n:100"))return 999;if(k.has("n:20"))return 99;if(k.has("n:11"))return 19;if(k.has("n:10"))return 10;
  return k.size?Math.max(...[...k].map(x=>+x.slice(2))):0;
}
function randNum(max){
  if(max<=19)return Math.floor(Math.random()*(max+1));
  const r=Math.random();
  if(max>=1000&&r<0.35)return Math.floor(Math.random()*max)+1;
  if(max>=100&&r<0.65)return Math.floor(Math.random()*Math.min(max,999))+1;
  return Math.floor(Math.random()*Math.min(max,99))+1;
}
function nearNums(n,max){
  const top=Math.max(max,10),s=new Set([n]);
  shuffle([n+1,n-1,n+10,n-10,n+100,n-100,+String(n).split("").reverse().join(""),n*10,Math.floor(n/10),n+2,n-2]).forEach(x=>{if(s.size<4&&x>=0&&x<=top&&x!==n)s.add(x);});
  while(s.size<4)s.add(Math.floor(Math.random()*(top+1)));
  return shuffle([...s]);
}
const NUM_ITEMS=["コーヒー","ラーメン","おちゃ","パン","すし","ほん","かさ","きっぷ","みず","Tシャツ"];
const NUM_MODES={mix:["🎲","Mixed"],n2r:["🔢→あ","Say the number"],r2n:["あ→🔢","Read the number"],listen:["👂","Listen"],type:["⌨️","Hear & type"],kanji:["漢","Kanji numbers"],price:["💴","Prices"]};
function numQ(type,max){
  let n=randNum(max);
  if(type==="price")n=max>=100?Math.max(10,Math.round(randNum(Math.min(max,9999))/10)*10):Math.max(1,n);
  const k=jaNum(n),near=nearNums(n,max);
  const Q={num:true,type,card:{front:String(n),back:k,sub:kanjiNum(n)+" · "+numRomaji(k),say:k,label:n+" ("+k+")"}};
  if(type==="n2r")Object.assign(Q,{prompt:String(n),ask:"How do you say this number?",answer:k,opts:near.map(jaNum)});
  if(type==="r2n")Object.assign(Q,{prompt:k,ask:"Which number is this?",answer:String(n),opts:near.map(String)});
  if(type==="listen")Object.assign(Q,{prompt:"",ask:"👂 Which number did you hear?",answer:String(n),opts:near.map(String)});
  if(type==="type")Object.assign(Q,{prompt:"",ask:"⌨️ Listen and type the number",answer:String(n),typeIn:true,listen:true});

const INT=[0,10*60e3,864e5,3*864e5,7*864e5,16*864e5,35*864e5];
function grade(ok){
  const f=UI.fc,id=f.q[f.i],c=S.cards[id]||{box:0,due:0},card=CARDS[id];
  if(ok){c.box=Math.min(c.box+1,6);c.due=Date.now()+INT[c.box];f.right++;
    if(c.box>=3){S.profile.weak=S.profile.weak.filter(w=>w!==card.label);}}
  else{c.box=0;c.due=Date.now();f.wrong++;f.missed.push(id);addUnique(S.profile.weak,[card.label],30);
    if(!f.requeued[id]){f.requeued[id]=1;f.q.push(id);}}
  S.cards[id]=c;S.stats.cards++;addXP(ok?2:1,"cards");save();
  f.i++;f.flip=!!f.learn;if(f.i>=f.q.length)planAuto("C",f.deck);render();if(f.learn)speakCard();
}

async function voiceCheck(){
  stopSpeak();resetAudio();VC.on=true;VC.r={};VC.mic=null;VC.fix="";

  const set=(k,ok,msg)=>{VC.r[k]=[ok?"ok":"bad",msg];vlog((ok?"✓ check ":"✗ check ")+k+": "+msg);vcShow();};
  const play=async(url,max)=>{const my=++natSeq;natBusy=true;try{await playUrl(url,my,1,max);}finally{if(my===natSeq)natBusy=false;}};
  // 1. a recording that ships with the app
  try{await play(recUrlFor("こんにちは"),4000);set("rec",true,"played");}catch(e){set("rec",false,"couldn't play the app's own audio file");}
  // 2. Ryusei live
  try{questCache.clear();const o=await Promise.race([questUrl("きょうは いい てんきですね。"),new Promise((_,rj)=>setTimeout(()=>rj(new Error("no answer in 15 s")),15000))]);
    const my=++natSeq;natBusy=true;try{await playQuestAudio(o,my);}finally{if(my===natSeq)natBusy=false;}set("quest",true,"played");}
  catch(e){set("quest",false,"tts.quest: "+String(e&&e.message||e).slice(0,60));}
  // 3. English online
  try{await play(WEB_EN.google[1]("Hello! This is the online English voice."),6000);set("web",true,"played");}catch(e){set("web",false,"the Google voice didn't play");}
  // 4. English iPhone voice
  await new Promise(res=>{if(!synth){set("iph",false,"no iPhone voice in this browser");return res();}
    const u=new SpeechSynthesisUtterance("And this is the iPhone voice.");u.lang="en-US";const v=voiceList("en-US")[0];if(v)u.voice=v;let st=false;
    u.onstart=()=>{st=true;};u.onend=()=>{set("iph",st,st?"played"+(v?" ("+v.name+")":""):"no sound");res();};u.onerror=e=>{set("iph",false,"error: "+(e.error||"?"));res();};
    try{synth.cancel();synth.speak(u);}catch(e){set("iph",false,e.message);res();}
    setTimeout(()=>{if(!st&&VC.r.iph[0]==="run"){try{synth.cancel();}catch(e){}set("iph",false,"didn't start in 6 s");res();}},6000);});
  // Switch to what works
  const ok=k=>VC.r[k][0]==="ok",fix=[];
  if(!ok("web")&&webEnId()){S.settings.voiceEn="";fix.push("English now uses the iPhone voice (the online voice didn't play).");}
  if(ok("web")&&!webEnId()&&!voiceList("en-US").some(isHQ)){S.settings.voiceEn="web:google";webEnFails=0;fix.push("English now uses the natural online voice.");}
  if(ok("web"))webEnFails=0;
  if(!ok("quest")&&S.settings.tts==="quest"){S.settings.tts="device";fix.push("Live Ryusei didn't work, so Yuki switched to ⚡ Fast voice (Ryusei still says every word you've learned). You can switch back in Me → Voice.");}
  save();VC.fix=fix.join(" ");vcShow();
}

document.addEventListener("change",e=>{
  const el=e.target;const k=el.dataset&&el.dataset.set;if(!k)return;
  if(k==="name"||k==="goal")S[k]=el.value.trim();
  else if(k.startsWith("about."))S.about[k.slice(6)]=el.value.trim();
  else if(k==="azRegion"){S.settings.azRegion=el.value;natCache.clear();}
  else if(k==="azEn"||k==="azJa"){S.settings[k]=el.value;save();speak(k==="azEn"?"Hi! This is how I'll sound in English.":"こんにちは、ゆきです。よろしくね！",{forceEnglish:true});return;}
  else if(k==="voice.en"||k==="voice.ja"){S.settings[k==="voice.en"?"voiceEn":"voiceJa"]=el.value;save();speak(k==="voice.en"?"Hi! This is how I'll sound in English.":"こんにちは、ゆきです。",{forceEnglish:true});return;}
  else if(k==="rate")S.settings.rate=parseFloat(el.value);
  else if(k.startsWith("daily.")){S.daily[k.slice(6)]=el.value.trim();save();if(UI.tab==="progress")rerender();return;}
  else if(k==="model")S.settings.model=el.value;
  save();if(k==="rate")speak("この速さでどうですか？",{});
});

(function icon(){try{const c=document.createElement("canvas");c.width=c.height=180;const x=c.getContext("2d");const g=x.createLinearGradient(0,0,180,180);g.addColorStop(0,"#f4a3c0");g.addColorStop(1,"#a8577a");x.fillStyle=g;x.fillRect(0,0,180,180);x.fillStyle="#2a1520";x.font="bold 110px 'Hiragino Sans',sans-serif";x.textAlign="center";x.textBaseline="middle";x.fillText("ゆ",90,98);$("#touchIcon").href=c.toDataURL("image/png");}catch(e){}})();

/* ============ UPDATES ============ */
// Auto-update: compare this page's own code with the live copy on GitHub Pages.
// Comparing the code itself (not just APP_VERSION) means any change gets picked up.
let lastCheck=0,updPending=false;
const UPD_KEY="yuki-upd-at";
const norm=t=>(t||"").replace(/\r\n/g,"\n").trim();
function liveDiffers(html){
  const js=(html.match(/<script>([\s\S]*?)<\/script>/)||[])[1],css=(html.match(/<style>([\s\S]*?)<\/style>/)||[])[1];
  if(js===undefined||css===undefined)return false;
  return norm(js)!==norm(document.querySelector("script:not([id])").textContent)||norm(css)!==norm(document.querySelector("style").textContent);
}
// Safe moment = nothing in progress that a reload would interrupt
function canReloadNow(){
  const a=document.activeElement,typing=a&&/INPUT|TEXTAREA/.test(a.tagName)&&a.value;
  const midCards=UI.fc&&UI.fc.i<UI.fc.q.length||UI.qz&&UI.qz.i<UI.qz.qs.length,sheetOpen=!$("#sheet").classList.contains("hidden");
  return !UI.busy&&!UI.voice&&!UI.listening&&!UI.place&&!UI.lp&&!midCards&&!sheetOpen&&!typing;
}
function applyUpdate(){
  // Loop guard: never auto-reload more than once every 2 minutes
  let at=0;try{at=+localStorage.getItem(UPD_KEY)||0;}catch(e){}
  if(Date.now()-at<120e3)return false;
  try{localStorage.setItem(UPD_KEY,String(Date.now()));}catch(e){}
  saveNow();location.replace(location.pathname+"?v="+Date.now());return true;
}
function checkUpdate(manual){
  if(location.protocol==="file:"){if(manual)toast("Updates only work on the website version");return;}
  lastCheck=Date.now();
  fetch(location.pathname+"?check="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.text():"").then(t=>{
    if(!t||!liveDiffers(t)){if(manual)toast("You're on the latest version ✓");return;}
    if(manual||canReloadNow()){if(!applyUpdate()&&manual)toast("Updating… if nothing changes, close and reopen Yuki");}
    else if(!updPending){updPending=true;toast("✨ Update ready — it'll load next time you open Yuki",3000);}
  }).catch(()=>{if(manual)toast("Couldn't check — are you online?");});
}
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible"){pingVV();lastAct=0;if(S.onboarded){checkFreeze();if(UI.tab==="home"||UI.tab==="progress")rerender();}}
  if(document.visibilityState==="hidden"){stopSpeak();saveNow();if(updPending)applyUpdate();return;}
  if(updPending){if(applyUpdate())return;}
  if(Date.now()-lastCheck>60e3)checkUpdate(false);
});
// While the app stays open, look again every 15 minutes
setInterval(()=>{if(document.visibilityState==="visible")checkUpdate(false);},15*60e3);

/* ============ START ============ */
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
try{matchMedia("(prefers-color-scheme: light)").addEventListener("change",()=>{if(S.settings&&S.settings.theme==="auto"){applyTheme();rerender();}});}catch(e){}
loadState().then(()=>{applyTheme();if(S.onboarded){checkFreeze();if(!S.daily.init){checkBadges(true);S.daily.init=true;save();}}fitViewport();render();pingVV();setTimeout(()=>checkUpdate(false),1500);});
