<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Yuki">
<meta name="theme-color" content="#151722">
<title>Yuki Sensei</title>
<link id="touchIcon" rel="apple-touch-icon" href="">
<style>
:root{
  --ink:#151722; --ink2:#1d2030; --ink3:#272b3f; --line:#33384f;
  --text:#eef0f7; --dim:#9298b3; --sakura:#f4a3c0; --sakura2:#d97a9f;
  --matcha:#9fd67c; --sky:#7cb8f4; --gold:#f2c36b; --red:#f27c7c;
  --vh:100dvh; --safeB:env(safe-area-inset-bottom,0px); --safeT:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--ink);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;font-size:16px;overscroll-behavior:none}
body{position:fixed;inset:0;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:active{transform:scale(.97)}
input,textarea,select{font:inherit;font-size:16px;color:var(--text)}
#app{height:var(--vh);display:flex;flex-direction:column;padding-top:var(--safeT)}
#main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative}
#tabs{display:flex;gap:4px;background:var(--ink2);border:1px solid var(--line);border-radius:28px;margin:4px 10px calc(6px + var(--safeB));padding:6px}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:700;color:var(--dim);min-height:52px;border-radius:22px}
#tabs button .ti{font-size:21px;line-height:1}
#tabs button.on{color:var(--sakura);background:var(--ink3)}
/* path */
.ptop{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 12px 4px;max-width:560px;margin:0 auto}
.pill{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;background:var(--ink2);border:1px solid var(--line);font-weight:800;font-size:16px}
.pill.fire{background:#3a2a12;border-color:#6b4a1c;color:var(--gold)}
.pathwrap{max-width:560px;margin:0 auto;padding:0 12px 40px}
#unitHead{position:sticky;top:6px;z-index:5;display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin:6px 0 -76px;height:70px;transition:opacity .2s;background:#1d2030ee;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:22px;padding:14px 16px}
#unitHead .uh{flex:1;min-width:0}
#unitHead small{display:block;color:var(--dim);font-weight:800;font-size:12.5px;letter-spacing:.03em}
#unitHead b{display:block;font-size:18px;margin-top:2px}
.unitpill{display:block;width:fit-content;max-width:92%;margin:34px auto 20px;padding:10px 18px;border-radius:999px;background:var(--ink2);color:var(--dim);font-weight:800;font-size:14px;text-align:center}
.nwrap{display:flex;flex-direction:column;align-items:center;margin:12px auto;width:170px}
.node{width:86px;height:86px;border-radius:32px;background:radial-gradient(circle at 40% 35%,#2e3160,#191b30);display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;color:#c9c2ff;position:relative}
.node.done{box-shadow:0 0 46px #9fd67c26}
.node .bd{position:absolute;right:-8px;bottom:-8px;width:34px;height:34px;border-radius:50%;background:var(--matcha);color:#173012;font-size:17px;font-weight:900;display:flex;align-items:center;justify-content:center;border:3px solid var(--ink)}
.node.cur{background:linear-gradient(140deg,var(--sakura),var(--sakura2));color:#2a1520;box-shadow:0 0 0 7px #f4a3c030,0 0 50px #f4a3c066;animation:throb 1.6s infinite}
.node.todo{opacity:.5}
.node.star{background:radial-gradient(circle at 40% 35%,#6a5520,#2a2312);color:var(--gold)}
.node.star.cur{background:linear-gradient(140deg,#f6d27a,#d9a640);color:#2a1d05}
.nlab{font-size:12.5px;color:var(--dim);margin-top:9px;text-align:center;line-height:1.3}
.nwrap.cur .nlab{color:var(--text);font-weight:700}
.tip{background:var(--text);color:var(--ink);font-weight:900;font-size:13px;padding:6px 12px;border-radius:10px;margin-bottom:12px;position:relative;letter-spacing:.04em}
.tip::after{content:"";position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);border:6px solid transparent;border-bottom:0;border-top-color:var(--text)}
#unitHead.ghost{opacity:0;pointer-events:none}
.ubanner{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin:30px 0 14px;padding:14px 16px;border-radius:22px;background:linear-gradient(135deg,color-mix(in srgb,var(--uc) 22%,var(--ink2)),var(--ink2));border:1px solid color-mix(in srgb,var(--uc) 35%,var(--line))}
.ube{font-size:30px;width:48px;height:48px;border-radius:16px;background:color-mix(in srgb,var(--uc) 25%,transparent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ubt{flex:1;min-width:0}.ubt small{display:block;font-size:12px;font-weight:800;color:var(--uc);letter-spacing:.05em;text-transform:uppercase}.ubt b{display:block;font-size:18px}
.ubp{font-size:13px;font-weight:800;color:var(--dim)}
.uhe{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.node{--uc:#c9c2ff}
.node:not(.cur):not(.star){background:radial-gradient(circle at 40% 30%,color-mix(in srgb,var(--uc) 30%,#262a48),#181a2e)}
.node.cur{background:linear-gradient(140deg,color-mix(in srgb,var(--uc) 80%,#fff),var(--uc));box-shadow:0 0 0 7px color-mix(in srgb,var(--uc) 22%,transparent),0 0 50px color-mix(in srgb,var(--uc) 45%,transparent)}
.node.kana{font-size:38px;color:#fff}
.nlab small{display:block;font-weight:500;color:var(--dim);font-size:11.5px;margin-top:2px}
.lp{padding-top:12px}
.lphead{display:flex;align-items:center;gap:10px}
.lpsteps{flex:1;display:flex;gap:6px;justify-content:center}
.lpsteps span{font-size:12.5px;font-weight:800;color:var(--dim);padding:6px 10px;border-radius:999px;background:var(--ink2)}
.lpsteps span.on{color:var(--ink);background:var(--text)}
.lpsteps span.ok{color:var(--matcha)}
.lpk{margin:18px 2px 10px;font-weight:700}
.wcard{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;padding:34px 18px 22px;border-radius:28px;background:linear-gradient(160deg,color-mix(in srgb,var(--uc) 18%,var(--ink2)),var(--ink2));border:1px solid var(--line)}
.wjp{font-size:44px;font-weight:800;line-height:1.25;text-align:center;word-break:keep-all}
.wro{font-size:18px;color:var(--sky);font-weight:700}
.wen{font-size:20px;font-weight:700;margin-top:4px;text-align:center}
.whear{font-size:13px;color:var(--dim);margin-top:10px}
.qcard{display:flex;flex-direction:column;align-items:center;padding:26px 16px;border-radius:24px;background:var(--ink2);margin-bottom:12px}
.qen2{font-size:24px;font-weight:800;text-align:center}
.opts{display:grid;gap:8px}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;min-height:56px;padding:12px 16px;border-radius:16px;background:var(--ink2);border:2px solid var(--line);text-align:left}
.opt b{font-size:18px}.opt span{font-size:13px;color:var(--dim)}
.opt.right{border-color:var(--matcha);background:#24361d}
.opt.wrong{border-color:var(--red);background:#3a2026}
.opt.dim{opacity:.45}
.fb{margin:12px 2px;font-weight:800}.fb.ok{color:var(--matcha)}.fb.no{color:var(--red)}
.tbar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid #ffffff0d;overflow-x:auto}
.tbar>.sub{flex-shrink:0;font-size:12px;font-weight:700}
.tchips{display:flex;gap:6px}
.tchip{flex-shrink:0;font-size:14px;font-weight:700;padding:6px 10px;border-radius:999px;background:var(--ink3);border:1px solid var(--line)}
.tchip.ok{background:#24361d;border-color:var(--matcha);color:var(--matcha)}
.ctbtn{text-align:left;background:none;border:none;padding:0;min-height:44px}
.caret{font-size:12px;color:var(--dim)}
.mtag{display:block;width:fit-content;margin:4px auto 0;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:#7cb8f422;color:var(--sky)}
.mtag.sp{background:#f4a3c022;color:var(--sakura)}
.vchips{width:100%;overflow-x:auto;display:flex;justify-content:center}
.vchips .tchips{flex-wrap:wrap;justify-content:center}
.donecard{margin:8px 12px;padding:14px;border-radius:18px;background:linear-gradient(140deg,#24361d,#1d2030);border:1px solid var(--matcha);display:flex;flex-direction:column;gap:4px}
.donecard b{font-size:16px;color:var(--matcha)}.donecard span{font-size:13px;color:var(--dim)}
.donecard.incall{margin:10px 0 0;width:100%;max-width:420px;text-align:center}
.donebtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.urow{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.urow:last-child{border-bottom:none}
.urow i{font-style:normal;width:24px;text-align:center;color:var(--matcha);font-weight:900}
.hidden{display:none!important}
.pad{padding:18px 16px 28px;max-width:560px;margin:0 auto}
.h1{font-size:24px;font-weight:800;letter-spacing:-.02em}
.h2{font-size:19px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--dim);font-size:14px;line-height:1.45}
.sec{font-size:13px;font-weight:700;color:var(--dim);margin:22px 2px 8px}
.card{background:var(--ink2);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:10px}
.hello{display:flex;align-items:center;gap:14px;margin:6px 0 18px}
.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(140deg,var(--sakura),var(--sakura2));display:flex;align-items:center;justify-content:center;font-weight:800;color:#2a1520;flex-shrink:0}
.av.big{width:58px;height:58px;font-size:26px}
.hero{display:block;width:100%;text-align:left;background:linear-gradient(150deg,#3a2433,#22243a);border:1px solid #5a3a4c}
.hero .tag{font-size:12px;color:var(--sakura);font-weight:700;margin-bottom:6px}
.hero .go{margin-top:12px;font-weight:700;color:var(--sakura)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--ink2);border:1px solid var(--line);border-radius:18px;padding:16px 14px;text-align:left;font-weight:700;font-size:15px;display:flex;flex-direction:column;gap:6px;min-height:96px}
.tile .ico{font-size:26px}
.tile small{font-weight:500;color:var(--dim);font-size:12px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--ink2);border:1px solid var(--line);border-radius:16px;padding:13px 14px;margin-bottom:8px}
.row .ri{width:42px;height:42px;border-radius:12px;background:var(--ink3);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;font-weight:700}
.row .rt{flex:1;min-width:0}
.row .rt b{display:block;font-size:15px}
.row .rt span{display:block;font-size:12.5px;color:var(--dim);margin-top:2px;line-height:1.35}
.row.done{border-color:#4b6b3a}
.row.done .ri{background:#2f4426}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;display:inline-flex;align-items:center;min-height:44px;background:var(--ink3);border:1px solid var(--line);border-radius:999px;padding:0 14px;font-size:13.5px;white-space:nowrap}
.chip.on{background:#4a2c3c;border-color:var(--sakura);color:var(--sakura)}
.btn{display:block;width:100%;padding:15px;border-radius:14px;font-weight:700;font-size:16px;background:linear-gradient(140deg,var(--sakura),var(--sakura2));color:#2a1520;text-align:center}
.btn.ghost{background:var(--ink3);color:var(--text);border:1px solid var(--line)}
.btn.sm{padding:10px;font-size:14px;min-height:44px}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--ink);border-radius:12px;padding:12px 6px;text-align:center}
.stat b{display:block;font-size:22px}
.stat span{font-size:11.5px;color:var(--dim)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tg{background:var(--ink3);border-radius:8px;padding:5px 9px;font-size:13px}
.tg.w{background:#4a2630;color:#ffc2cf}
.tg.s{background:#2c4224;color:#c9f0b2}
.field{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px;margin:6px 0 10px;outline:none}
.field:focus{border-color:var(--sakura)}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.toggle:last-child{border-bottom:none}
.sw{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;transition:.2s;flex-shrink:0}
.sw::before{content:"";position:absolute;inset:-7px -4px}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--matcha)}
.sw.on::after{left:23px}
/* chat */
.chat{display:flex;flex-direction:column;height:100%}
.chathead{display:flex;align-items:center;gap:10px;padding:8px 12px;flex-shrink:0;border-bottom:1px solid #ffffff0d}
.chathead .ct{flex:1;min-width:0}
.chathead .ct b{display:block;font-size:16px}
.chathead .ct small{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chathead .ct small::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--matcha);flex-shrink:0}
.mini{display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:44px;background:var(--ink3);border:1px solid var(--line);border-radius:12px;padding:0 12px;font-size:13px;font-weight:700}
.mini.ok{border-color:var(--matcha);color:var(--matcha)}
.iconbtn{width:44px;height:44px;border-radius:50%;background:var(--ink3);border:none;font-size:19px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.iconbtn.call{background:linear-gradient(140deg,var(--sakura),var(--sakura2))}
.iconbtn.live{background:#4a2630;box-shadow:0 0 0 2px var(--red);animation:throb 1.2s infinite}
.msgs{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 14px;display:flex;flex-direction:column;gap:6px}
.m{display:flex;gap:8px;max-width:100%}
.m.u{justify-content:flex-end;margin-top:8px}
.m.a{margin-top:8px}
.m.a.cont{margin-top:0}
.bub{max-width:82%;padding:11px 15px;border-radius:20px;font-size:16px;line-height:1.6;word-break:break-word}
.m.a .bub{background:var(--ink2);border-bottom-left-radius:6px}
.m.u .bub{background:linear-gradient(140deg,#5a3247,#46283a);border-bottom-right-radius:6px}
.bubwrap{display:flex;flex-direction:column;max-width:86%}
.bubwrap .bub{max-width:100%;position:relative;padding-bottom:6px}
.bub.withsay{display:flex;align-items:flex-end;gap:2px;padding-right:4px;padding-bottom:4px}
.bub.withsay>.bt{flex:1;min-width:0;padding-bottom:7px}
.say{width:40px;height:40px;margin:-4px -2px -2px 0;border-radius:12px;font-size:15px;opacity:.7;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.say.on{color:var(--sakura)}
.bub code{background:var(--ink3);padding:1px 5px;border-radius:5px}
.listen{display:inline-flex;flex-direction:column;gap:4px;margin:4px 0}
.play{min-height:44px;background:var(--sky);color:#0f2235;font-weight:800;border-radius:12px;padding:0 16px;font-size:14px}
.hid{filter:blur(6px);font-size:14px;color:var(--dim);padding:8px 0;cursor:pointer}
.hid.show{filter:none}
.err{background:#3a2026;border:1px solid #6b3340;border-radius:16px;padding:12px;font-size:14px;line-height:1.5;max-width:86%}
.dots{display:flex;gap:5px;padding:4px 2px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--dim);animation:dot 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
.chatfoot{padding:6px 10px 8px;flex-shrink:0}
.chatfoot .chips{padding-bottom:6px}
.chatfoot .chip{min-height:40px;font-size:13px;background:transparent}
.inputbar{display:flex;gap:6px;align-items:flex-end;background:var(--ink2);border:1px solid var(--line);border-radius:26px;padding:4px}
.inputbar:focus-within{border-color:var(--sakura)}
.inputbar .iconbtn{background:transparent}
#inp{flex:1;background:transparent;border:none;padding:11px 4px;resize:none;outline:none;max-height:120px;line-height:1.35}
.send{width:44px;height:44px;border-radius:50%;background:linear-gradient(140deg,var(--sakura),var(--sakura2));color:#2a1520;font-size:20px;font-weight:900;flex-shrink:0}
/* flashcards */
.fc{perspective:1000px;margin:10px 0 16px}
.fcin{background:var(--ink2);border:1px solid var(--line);border-radius:24px;min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;gap:10px}
.fcf{font-size:84px;font-weight:700;line-height:1.1}
.fcf.long{font-size:44px}
.fcb{font-size:28px;font-weight:800;color:var(--sakura)}
.fcs{font-size:18px;color:var(--dim)}
.bar{height:6px;border-radius:3px;background:var(--ink3);overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--sakura);border-radius:3px}
.kgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.kc{background:var(--ink2);border:1px solid var(--line);border-radius:12px;padding:8px 0;text-align:center}
.kc b{display:block;font-size:26px;font-weight:600}
.kc span{font-size:11px;color:var(--dim)}
.kc.blank{visibility:hidden}
.kc.weak{border-color:var(--red)}
/* voice overlay */
#voice{position:fixed;inset:0;background:radial-gradient(120% 70% at 50% 28%,#2b2340 0%,#141624 60%,#101119 100%);z-index:50;display:flex;flex-direction:column;padding:calc(10px + var(--safeT)) 16px calc(16px + var(--safeB))}
.vtop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.vtitle{text-align:center;flex:1}
.vtitle b{display:block;font-size:17px}
.vtitle small{color:var(--dim);font-size:12.5px}
.seg{display:flex;background:#ffffff10;border-radius:14px;padding:3px}
.seg button{min-width:44px;min-height:38px;border-radius:11px;font-size:14px;font-weight:800;color:var(--dim);padding:0 8px}
.seg button.on{background:var(--text);color:var(--ink)}
.orbwrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.orbwrap>*{flex-shrink:0}
.orbwrap.compact{justify-content:flex-start;gap:12px;padding-top:6px}
.orbwrap.compact .orb{width:110px;height:110px;font-size:42px}
.orb{width:170px;height:170px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe3ee,var(--sakura) 45%,var(--sakura2));box-shadow:0 0 0 14px #f4a3c014,0 0 90px #f4a3c050;display:flex;align-items:center;justify-content:center;font-size:60px;font-weight:800;color:#3a1828;transition:.3s}
.orb.listening{animation:breathe 1.1s infinite;box-shadow:0 0 0 16px #f27c7c1c,0 0 100px #f27c7c80;background:radial-gradient(circle at 35% 30%,#ffe6e6,#f27c7c 50%,#c24f5f)}
.orb.thinking{animation:spin 2.4s linear infinite;opacity:.8}
.orb.speaking{animation:talk .45s infinite alternate}
.vstat{font-size:14px;color:var(--dim);font-weight:700;letter-spacing:.02em}
.vcap{width:100%;max-width:520px;min-height:90px}
.vtext{max-height:28vh;overflow-y:auto;font-size:19px;line-height:1.55;text-align:center;padding:0 8px;font-weight:600}
.vtext.off{filter:blur(8px);opacity:.5}
.vyou{font-size:14.5px;color:var(--dim);text-align:center;min-height:22px;margin-top:12px}
.vctrl{display:flex;justify-content:space-between;align-items:flex-start;gap:4px;max-width:420px;width:100%;margin:8px auto 0}
.vbtn{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;color:var(--dim);font-weight:700;min-width:52px}
.vbtn i{font-style:normal;width:52px;height:52px;border-radius:50%;background:#ffffff12;display:flex;align-items:center;justify-content:center;font-size:21px}
.vbtn.on i{background:#ffffff2a}
.bigmic{width:84px;height:84px;border-radius:50%;background:linear-gradient(140deg,var(--sakura),var(--sakura2));font-size:34px;box-shadow:0 8px 34px #f4a3c060;display:flex;align-items:center;justify-content:center;margin-top:-13px}
.bigmic.live{background:linear-gradient(140deg,#ff9a9a,#d64f63);animation:throb 1.2s infinite}
.vend{background:#d64f63!important}
.micbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:78px;height:78px;flex-shrink:0;border-radius:50%;font-size:12px;font-weight:800;margin-top:-13px;color:#2a1520}
.micbtn span{font-size:28px;line-height:1}
.micbtn.ja{background:linear-gradient(140deg,var(--sakura),var(--sakura2));box-shadow:0 8px 30px #f4a3c055}
.micbtn.en{background:linear-gradient(140deg,#a9d3ff,var(--sky));box-shadow:0 8px 30px #7cb8f455;color:#0f2235}
.micbtn.live{background:linear-gradient(140deg,#ff9a9a,#d64f63);color:#fff;animation:throb 1.2s infinite}
.iconbtn small{font-size:9px;font-weight:900;margin-left:-2px;align-self:flex-end;margin-bottom:9px}
.micen{color:var(--sky)}
.vopts{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin-top:8px}
.vlen{display:flex;background:#ffffff10;border-radius:999px;padding:2px}
.vopt{min-height:36px;padding:0 12px;border-radius:999px;font-size:12.5px;font-weight:800;color:var(--dim)}
.vopt.on{background:#ffffff22;color:var(--text)}
.vtext.vlive{font-size:22px;color:var(--text);min-height:60px}
.micbtn.send{background:linear-gradient(140deg,#c9f0b2,var(--matcha));color:#173012;box-shadow:0 8px 30px #9fd67c55}
.micbtn.alt{opacity:.9;transform:scale(.88)}
/* sheet + toast */
#sheet{position:fixed;inset:0;background:#000a;z-index:80;display:flex;align-items:flex-end}
#sheet .sh{background:var(--ink2);width:100%;max-height:85vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + var(--safeB))}
#sheet ol{padding-left:20px;line-height:1.6;font-size:15px}
#sheet li{margin-bottom:8px}
#toast{position:fixed;left:50%;bottom:calc(90px + var(--safeB));transform:translateX(-50%);background:#000d;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:90;opacity:0;transition:.25s;pointer-events:none;max-width:88%;text-align:center}
#toast.on{opacity:1}
.prow{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.pchk{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;font-weight:900;color:#1d2a16;font-size:18px}
.prow.ok .pchk{background:var(--matcha);border-color:var(--matcha)}
.ptxt{flex:1;min-width:0;text-align:left;background:var(--ink3);border-radius:12px;padding:9px 12px;min-height:44px}
.ptxt b{display:block;font-size:14.5px}
.ptxt span{display:block;font-size:12px;color:var(--dim);margin-top:1px}
.prow.ok .ptxt b{text-decoration:line-through;opacity:.65}
.dayh{font-size:13px;font-weight:700;color:var(--dim);margin:14px 2px 6px}
.dayh.today{color:var(--sakura)}
.qen{color:var(--dim);font-size:15px;margin:-8px 0 16px}
.qbig{font-size:22px;font-weight:700;line-height:1.5;margin:18px 0 16px}
.obnav{display:flex;gap:8px;margin-top:18px}
.obnav .btn{flex:1}
.obnav .btn.ghost{flex:0 0 96px}
@keyframes dot{0%,80%,100%{opacity:.25}40%{opacity:1}}
@keyframes throb{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes talk{from{transform:scale(1)}to{transform:scale(1.05)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function merge(base,saved){for(const k in saved){if(saved[k]&&typeof saved[k]==="object"&&!Array.isArray(saved[k])&&base[k]&&typeof base[k]==="object")merge(base[k],saved[k]);else base[k]=saved[k];}return base;}

async function loadState(){

  else if(window.storage){try{const r=await window.storage.get(KEY);raw=r&&r.value;}catch(e){}}

/* ---- chat threads: one chat per lesson/talk so conversations don't clump together ---- */
function linkChat(){if(!S.threads)S.threads={};if(!S.threads.main)S.threads.main={title:"Chat with Yuki",kind:"free",msgs:[],at:0};if(!S.threads[S.chatId])S.chatId="main";S.chat=S.threads[S.chatId].msgs;}
function openThread(id,title,kind,fresh){
  let t=S.threads[id];
  if(!t)t=S.threads[id]={title,kind,msgs:[],at:Date.now()};
  t.title=title||t.title;t.kind=kind||t.kind;t.at=Date.now();
  if(fresh)t.msgs.length=0;
  S.chatId=id;linkChat();
  // keep the 30 most recent lesson chats (plus the main one)
  const ids=Object.keys(S.threads).filter(k=>k!=="main").sort((a,b)=>S.threads[b].at-S.threads[a].at);
  ids.slice(30).forEach(k=>delete S.threads[k]);
  save();
}

// Upgrades older or damaged saves in place so progress is never wiped.
// When the shape of S changes, bump DEFAULT.v and add a step here.
function migrate(st){
  const arr=x=>Array.isArray(x)?x:[], num=x=>Number.isFinite(+x)?+x:0;
  const obj=x=>x&&typeof x==="object"&&!Array.isArray(x)?x:{};
  ["facts","weak","strong","learned"].forEach(k=>st.profile[k]=arr(st.profile[k]).map(String));
  ["msgs","quizRight","quizWrong","cards","streak"].forEach(k=>st.stats[k]=num(st.stats[k]));
  st.done=arr(st.done);st.chat=arr(st.chat).filter(m=>m&&typeof m.text==="string");st.cards=obj(st.cards);
  for(const id in st.cards){const c=st.cards[id];if(!CARDS[id]||!c||typeof c!=="object")delete st.cards[id];else{c.box=Math.max(0,Math.min(6,num(c.box)));c.due=num(c.due);}}
  if(!LV[st.level])st.level="n5";
  if(st.currentLesson&&!lessonById(st.currentLesson))st.currentLesson=null;
  if(!["claude-haiku-4-5-20251001","claude-sonnet-5-5"].includes(st.settings.model))st.settings.model=DEFAULT.settings.model;
  // v3 → v4: learner profile, level check, reply style, credit saver, voice choice (defaults come from merge)
  st.about.focus=arr(st.about.focus).map(String);
  ["location","native","notes","hira","kata","kanji"].forEach(k=>st.about[k]=typeof st.about[k]==="string"?st.about[k]:"");
  st.about.minutes=num(st.about.minutes)||15;
  if(st.placement&&(!LV[st.placement.level]||typeof st.placement.bands!=="object"))st.placement=null;
  const sty=obj(st.settings.style);
  Object.entries(STYLE_OPTS).forEach(([k,[,opts]])=>{if(!opts.some(([v])=>v===sty[k]))sty[k]=DEFAULT.settings.style[k];});
  sty.simple=!!sty.simple;st.settings.style=sty;
  // v4 → v5: guided plan
  if(st.plan&&(typeof st.plan!=="object"||!/^\d{4}-\d{2}-\d{2}$/.test(st.plan.start||"")))st.plan=null;
  if(st.plan){st.plan.done=obj(st.plan.done);st.plan.custom=arr(st.plan.custom).filter(c=>c&&c.id&&c.title);}  // v6: custom path lessons
  // v6 → v7: natural voices
  const S2=st.settings;
  if(!["device","azure","voicevox","quest"].includes(S2.tts))S2.tts="quest";
  if(typeof S2.vvUrl!=="string")S2.vvUrl="";
  if(S2.tts==="voicevox"&&!S2.vvUrl.trim())S2.tts="device";
  if(!["device","azure","voicevox","quest"].includes(S2.tts))S2.tts="quest";
  // v9 → v10: Ryusei everywhere (live voice via free tts.quest, recordings in Ryusei)
  if((st.v||0)<10){S2.jaRec="ryusei";if(S2.tts==="device")S2.tts="quest";}
  // v10 → v11: Ryusei can read English too
  if(!["ryusei","iphone"].includes(S2.enVoice))S2.enVoice="ryusei";
  // v11 → v12: Ryusei can't really speak English, so English goes back to the iPhone voice
  // v14 → v15: owner wants Ryusei for English too (no robot voice)
  if((st.v||0)<15)S2.enVoice="ryusei";
  // v15 → v16: shorter replies by default, hands-free calls
  if((st.v||0)<16){if(S2.style&&S2.style.length==="normal")S2.style.length="short";S2.handsFree=true;}
  S2.handsFree=S2.handsFree!==false;
  if(typeof S2.questKey!=="string")S2.questKey="";
  // v12 → v13: the mic listens in Japanese by default (English mode turned "ohayou" into "Ohio")
  if((st.v||0)<13)S2.micLang="ja-JP";
  // v13 → v14: separate chats per lesson; the old single chat becomes "Chat with Yuki"
  st.threads=obj(st.threads);
  if(!st.threads.main||!Array.isArray(st.threads.main.msgs)||(st.v||0)<14&&st.chat&&st.chat.length&&!st.threads.main.msgs.length)
    st.threads.main={title:"Chat with Yuki",kind:"free",msgs:arr(st.chat).filter(m=>m&&typeof m.text==="string"),at:Date.now()};
  Object.keys(st.threads).forEach(k=>{const t=st.threads[k];if(!t||typeof t!=="object"){delete st.threads[k];return;}t.msgs=arr(t.msgs).filter(m=>m&&typeof m.text==="string");t.title=String(t.title||"Chat");t.kind=t.kind||"chat";t.at=num(t.at);});
  if(!st.threads[st.chatId])st.chatId="main";
  st.chat=st.threads[st.chatId].msgs;
  if(typeof S2.azKey!=="string")S2.azKey="";
  if(!AZ_REGIONS.includes(S2.azRegion))S2.azRegion="eastus";
  if(!AZ_VOICES.en.some(v=>v[0]===S2.azEn))S2.azEn=DEFAULT.settings.azEn;
  if(!AZ_VOICES.ja.some(v=>v[0]===S2.azJa))S2.azJa=DEFAULT.settings.azJa;
  S2.ttsChars=obj(S2.ttsChars);S2.ttsChars.n=num(S2.ttsChars.n);if(typeof S2.ttsChars.month!=="string")S2.ttsChars.month="";
  S2.captions=S2.captions!==false;
  // v7 → v8: free recorded Japanese voice for cards and kana
  if(!["himari","ryusei","off"].includes(S2.jaRec))S2.jaRec="himari";
  // v8 → v9: conversation course (active talk is S.course)
  if(st.course&&(typeof st.course!=="object"||!Array.isArray(st.course.targets)))st.course=null;
  if(![6,12,24].includes(+st.settings.history))st.settings.history=12;else st.settings.history=+st.settings.history;
  st.v=DEFAULT.v;
  return st;
}

   .replace(/([\u3040-\u30ff\u3400-\u9fff\u3005][」』]?)\s*[（(]\s*[A-Za-zāēīōūÂâÊêÎîÔôÛû'\- ]+\s*[)）]/g,"$1")

  const base=vvBase(S.settings.vvUrl),sp=vvSpeaker(),speed=Math.max(0.6,Math.min(1.3,rate||1)),key=sp+"|"+speed+"|"+text;

// Asks tts.quest for Ryusei audio. Without a key the free service often answers "wait N seconds";
// like its official browser example, keep waiting and retrying (up to ~25 s in total).
let questLastErr="";
async function questUrl(text){
  const key=vvSpeaker()+"|"+text;
  if(questCache.has(key))return questCache.get(key);
  const p=(async()=>{
    const qk=(S.settings.questKey||"").trim();
    const url=`${QUEST_API}?speaker=${vvSpeaker()}&text=${encodeURIComponent(text)}${qk?"&key="+encodeURIComponent(qk):""}`;
    let waited=0;
    for(let attempt=0;attempt<6;attempt++){
      let r,j;
      try{r=await withTimeout(fetch(url),20000);}catch(e){questLastErr=e.message==="timeout"?"no answer (timeout)":"can't connect ("+e.message+")";throw new Error(questLastErr);}
      try{j=await r.json();}catch(e){questLastErr="HTTP "+r.status;throw new Error(questLastErr);}
      if(j.mp3StreamingUrl||j.mp3DownloadUrl)return{stream:j.mp3StreamingUrl,mp3:j.mp3DownloadUrl,wav:j.wavDownloadUrl,status:j.audioStatusUrl};
      if(j.retryAfter!=null&&waited+ +j.retryAfter<=25){const w=(+j.retryAfter+1)*1000;waited+=w/1000;natLoading=true;await new Promise(res=>setTimeout(res,w));continue;}
      questLastErr=j.errorMessage||("HTTP "+r.status);throw new Error(questLastErr);
    }
    questLastErr="busy for too long";throw new Error(questLastErr);
  })();
  questCache.set(key,p);p.catch(()=>questCache.delete(key));
  if(questCache.size>80)questCache.delete(questCache.keys().next().value);
  return p;
}
function playUrl(url,my,rate){return new Promise((res,rej)=>{
  if(my!==natSeq)return res();
  const a=questPlayer();let done=false;const fin=(ok)=>{if(done)return;done=true;clearTimeout(t);a.onended=a.onerror=null;natPlaying=false;ok?res():rej(new Error("play"));};
  const t=setTimeout(()=>fin(false),45000);
  a.onended=()=>fin(true);a.onerror=()=>fin(false);
  a.src=url;a.playbackRate=rate&&rate<0.75?0.8:1;natPlaying=true;
  a.play().then(()=>{a.dataset.ok="1";}).catch(()=>fin(false));
});}

// iPhone Safari is unreliable with half-made streams, so wait until tts.quest says the file is ready and
// play the finished MP3. If the status can't be read, try the stream, then the finished file a few times.
let questStage="";
async function playQuestAudio(o,my,rate){
  if(typeof o==="string")return playUrl(o,my,rate);
  let ready=false,statusOk=false;
  if(o.status){
    questStage="waiting for the audio";
    for(let i=0;i<50&&my===natSeq;i++){
      try{const r=await withTimeout(fetch(o.status+(o.status.includes("?")?"&":"?")+"t="+Date.now()),6000);const st=await r.json();statusOk=true;
        if(st.isAudioError){questStage="tts.quest couldn't make the audio";throw new Error(questStage);}
        if(st.isAudioReady){ready=true;break;}}
      catch(e){if(statusOk&&/couldn't make/.test(e.message))throw e;if(!statusOk)break;}
      await new Promise(r=>setTimeout(r,400));
    }
  }
  if(my!==natSeq)return;
  questStage="playing";
  if(ready&&o.mp3){try{return await playUrl(o.mp3,my,rate);}catch(e){}}
  if(o.stream){try{return await playUrl(o.stream,my,rate);}catch(e){}}
  for(let i=0;i<8&&my===natSeq;i++){
    await new Promise(r=>setTimeout(r,1500));
    for(const u of [o.mp3,o.wav]){if(!u)continue;try{return await playUrl(u,my,rate);}catch(e){}}
  }
  questStage="the audio wouldn't play";throw new Error(questStage);
}

function englishForVV(t){t=t.toLowerCase().replace(/[’‘]/g,"'");EN_FIX.forEach(([a,b])=>{t=t.replace(a,b);});return t;}
const enRyusei=()=>S.settings.enVoice==="ryusei";
// Japanese parts: Ryusei's recording if we have one (instant), otherwise live from tts.quest;
// English parts: Ryusei too (live) when enVoice is "ryusei", else the iPhone voice
async function speakQuest(segs,rate,text,opts){
  if(enRyusei()&&!opts.noSplit){
    // the whole reply in ONE live request (a single word you've learned still plays from the recording)
    const whole=segs.map(sg=>sg.k==="en"?englishForVV(sg.t):sg.t).join(" ").replace(/\s+/g," ").trim();
    const single=segs.length===1&&segs[0].k==="ja"&&RECORDED.has(recKey(segs[0].t));
    segs=single?[{k:"ja",t:segs[0].t}]:[{k:"ja",t:whole,orig:segs.map(x=>x.t).join(" ")}];
  }
  const my=++natSeq;natBusy=true;
  const recUrl=sg=>{const k=recKey(sg.t);return RECORDED.has(k)?recUrlFor(k):null;};
  const jobs=segs.map(sg=>sg.k!=="ja"?null:(recUrl(sg)||questUrl(sg.t.trim())));
  jobs.forEach(j=>j&&j.catch&&j.catch(()=>{}));
  try{
    for(let i=0;i<segs.length;i++){
      if(my!==natSeq)return;
      if(!jobs[i]){await sayDevice(segs[i].t.trim(),"en-US",rate);continue;}
      // (with enVoice "ryusei" every segment is sent as "ja", so it never reaches the iPhone English voice unless the service fails)
      natLoading=true;let url=null;try{url=typeof jobs[i]==="string"?jobs[i]:await jobs[i];}catch(e){
        if(!questNote){questNote=true;toast("Ryusei's voice didn't answer ("+e.message+"). Tap Me → Voice → Test Ryusei for details.",4500);}}
      natLoading=false;if(my!==natSeq)return;
      if(url){try{await playQuestAudio(url,my,rate);continue;}catch(e){if(!questNote){questNote=true;toast("Ryusei's audio: "+e.message+" — using the iPhone voice",4000);}}}
      if(my!==natSeq)return;
      if(segs[i].orig!==undefined)await speakPlainDevice(segs[i].orig,rate);else await sayDevice(segs[i].t.trim(),"ja-JP",rate);
    }
  }finally{if(my===natSeq){natBusy=false;natLoading=false;}}
}
// Fallback reader for mixed text: split again and read each part with the right iPhone voice
async function speakPlainDevice(t,rate){for(const sg of segments(t))await sayDevice(sg.t.trim(),sg.k==="ja"?"ja-JP":"en-US",rate);}
// Any Japanese bit of a reply that matches a recording (all course words, kana, cards) plays in
// Himari/Ryusei; the rest uses the iPhone voice. No server or key needed.
const recKey=t=>t.replace(/[\s、。！？!?,.「」…~～]/g,"");
async function speakWithRecordings(segs,rate,text,opts){
  const my=++natSeq;natBusy=true;
  try{
    for(let i=0;i<segs.length;i++){
      if(my!==natSeq)return;
      const k=recKey(segs[i].t);
      if(segs[i].k==="ja"&&RECORDED.has(k)){try{await playUrl(recUrlFor(k),my,rate);continue;}catch(e){}}
      if(my!==natSeq)return;
      await sayDevice(segs[i].t.trim(),segs[i].k==="ja"?"ja-JP":"en-US",rate);
    }
  }finally{if(my===natSeq){natBusy=false;natLoading=false;}}
}
function speakDevice(text,opts){
  opts=opts||{};
  if(!synth){toast("Speech isn't supported in this browser");return;}
  synth.cancel();
  const segs=segments(cleanSpeech(text)).filter(s=>s.k==="ja"||S.settings.speakEnglish||opts.forceEnglish);
  const rate=(opts.rate||S.settings.rate);
  segs.forEach(s=>{
    const u=new SpeechSynthesisUtterance(s.t.trim());
    u.lang=s.k==="ja"?"ja-JP":"en-US";
    const v=pickVoice(u.lang);if(v)u.voice=v;
    // English sounds most natural near normal speed and pitch; Japanese follows the speed slider
    u.rate=s.k==="ja"?rate:Math.max(0.85,Math.min(1.05,rate+0.1));
    u.pitch=s.k==="ja"?1.05:1;
    synth.speak(u);
  });
}

let rec=null;
function micSupported(){return !!(window.SpeechRecognition||window.webkitSpeechRecognition);}
// You decide when you're done: listening keeps going (it restarts itself if iPhone stops after a
// pause) until you tap Send. Tapping the other language mid-way continues in that language, so one
// message can mix 日本語 and English.
const MIC={on:false,lang:"ja-JP",base:"",sess:"",stopReq:false,cancel:false,onText:null,onDone:null,restarts:0,heardAt:0};
function micText(){return(MIC.base+" "+MIC.sess).replace(/\s+/g," ").trim();}
function micRun(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  try{rec=new SR();}catch(e){micHelp("blocked");micFinish(true);return;}
  rec.lang=MIC.lang;rec.interimResults=true;rec.continuous=true;rec.maxAlternatives=1;
  MIC.sess="";
  rec.onresult=e=>{let t="";for(let i=0;i<e.results.length;i++)t+=e.results[i][0].transcript;MIC.sess=MIC.lang==="ja-JP"?jaDigits(t):t;MIC.heardAt=Date.now();if(MIC.onText)MIC.onText(micText());};
  rec.onerror=e=>{
    if(e.error==="not-allowed"||e.error==="service-not-allowed"||e.error==="audio-capture"){MIC.stopReq=true;MIC.cancel=true;micHelp("blocked");}
    else if(e.error!=="no-speech"&&e.error!=="aborted"&&e.error!=="network")toast("Mic problem: "+e.error);};
  rec.onend=()=>{
    MIC.base=micText();MIC.sess="";
    if(MIC.stopReq||!MIC.on){micFinish();return;}
    // iPhone ended by itself (pause/timeout): keep listening, unless nothing was said for 25 s
    if(Date.now()-MIC.heardAt>25000||++MIC.restarts>40){toast("Stopped listening — tap 🎤 to talk again");micFinish(!micText());return;}
    setTimeout(()=>{if(MIC.on&&!MIC.stopReq)micRun();},150);
  };
  try{rec.start();}catch(e){setTimeout(()=>{if(MIC.on&&!MIC.stopReq)micRun();},300);}
}
function startMic(onText,onDone,lang){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){micHelp("unsupported");return false;}
  stopSpeak();
  Object.assign(MIC,{on:true,lang:lang||S.settings.micLang,base:"",sess:"",stopReq:false,cancel:false,onText,onDone,restarts:0,heardAt:Date.now()});
  UI.micLang=MIC.lang;UI.listening=true;setAudioMode("play-and-record");refreshMic();
  micRun();return true;
}
// Switch language mid-message: what you said so far stays, listening continues in the other language
function switchMicLang(lang){
  if(!MIC.on||MIC.lang===lang)return;
  MIC.lang=lang;UI.micLang=lang;MIC.heardAt=Date.now();
  if(rec){rec.onend=()=>{MIC.base=micText();MIC.sess="";if(MIC.on&&!MIC.stopReq)micRun();else micFinish();};try{rec.stop();}catch(e){micRun();}}
  refreshMic();toast(lang==="ja-JP"?"🎤 Now listening in 日本語":"🎤 Now listening in English",1200);
}
function stopMic(cancel){if(!MIC.on)return;MIC.stopReq=true;if(cancel)MIC.cancel=true;if(rec){try{rec.stop();}catch(e){micFinish();}}else micFinish();}
function micFinish(cancelled){
  if(!MIC.on)return;MIC.on=false;
  const text=micText(),done=MIC.onDone,cancel=cancelled||MIC.cancel;
  UI.listening=false;setAudioMode("auto");refreshMic();
  if(done)done(cancel?"":text);
}
function refreshMic(){
  document.querySelectorAll(".micja,.micen").forEach(b=>{const live=UI.listening&&b.dataset.v===UI.micLang;b.classList.toggle("live",live);});

function learnerCard(){
  const a=S.about,P=S.placement,parts=[];
  if(a.location)parts.push("lives in "+a.location);
  if(a.native)parts.push("native language: "+a.native);
  if(a.hira)parts.push("reads hiragana: "+a.hira);
  if(a.kata)parts.push("reads katakana: "+a.kata);
  if(a.kanji)parts.push("kanji known: "+(KANJI_LV[a.kanji]||a.kanji));
  if(a.focus.length)parts.push("wants to focus on: "+a.focus.join(", "));
  if(a.minutes)parts.push("studies about "+a.minutes+" min a day");
  if(P)parts.push(`level check (${P.date}): ${LV[P.level].label} — `+BANDS.filter(b=>P.bands[b]).map(b=>b.toUpperCase()+" "+P.bands[b][0]+"/"+P.bands[b][1]).join(", "));
  if(a.notes)parts.push("in their own words: "+a.notes.slice(0,300));
  return parts.join("; ")||"not filled in yet";
}
function styleRules(){
  const st=S.settings.style,r=[];
  r.push({tiny:"Reply in 1-2 short, direct sentences (under 25 words). No filler, no long praise, at most one question.",short:"Keep replies short: 2-4 short sentences, under 60 words, one idea at a time.",normal:"Keep replies short and chatty: usually under 120 words.",detailed:"You may give fuller explanations (up to about 250 words) with extra examples when teaching."}[st.length]);
  r.push({more:"Explain in English; use Japanese for examples and practice.",balanced:"Mix English explanations with Japanese at their level.",immersion:"Speak mostly Japanese at their level; use English only for tricky explanations or when they're stuck."}[st.english]);
  r.push({auto:"Reading help: match their level. N5: mostly kana, with readings in brackets after kanji like 学校(がっこう). Romaji only for total beginners, and only at first.",romaji:"After every Japanese sentence, add romaji in brackets.",kana:"After every word with kanji, add its reading in brackets, like 学校(がっこう). No romaji.",none:"No romaji and no reading brackets unless they ask."}[st.script]);
  if(st.simple)r.push("Use simple, plain English: short sentences, everyday words, no grammar jargon. If you must use a grammar term, explain it in a few words.");
  return r.map(x=>"- "+x).join("\n");
}

- Lessons finished: ${S.done.length?S.done.map(id=>(lessonById(id)||{}).title).filter(Boolean).slice(-15).join(", "):"none yet"}
- Things you know about them: ${p.facts.join("; ")||"nothing yet"}
- Weak spots: ${p.weak.slice(-15).join("; ")||"none recorded"}
- Strong spots: ${p.strong.slice(-10).join("; ")||"none recorded"}
- Recently learned: ${p.learned.slice(-25).join("; ")||"nothing yet"}
- Quiz record: ${S.stats.quizRight} right, ${S.stats.quizWrong} wrong. Flashcards due: ${due}.
${coursePrompt()}${les?`\nCURRENT LESSON: "${les.title}" — ${les.desc} (${LV[les.level].label}, unit "${les.unit}"). Teach it in small steps: short explanation → 2-3 examples → a quick practice question, then wait for their answer. Never dump the whole lesson at once. When they've shown they understand the core of it, congratulate them and tell them they can tap "✓ Done".`:""}`;
}
function buildMessages(){
  const msgs=[];
  S.chat.slice(-(S.settings.history||12)).forEach(m=>{
    if(m.err)return;
    const role=m.role==="user"?"user":"assistant";
    const content=(m.role==="user"&&m.api)?m.api:m.text;
    if(!msgs.length&&role!=="user")return;
    if(msgs.length&&msgs[msgs.length-1].role===role)msgs[msgs.length-1].content+="\n\n"+content;
    else msgs.push({role,content});
  });
  return msgs;
}
// One place that talks to the Anthropic API. With no key saved, it sends no auth
// (that only works inside Claude's own preview); otherwise it uses your key.
async function apiRequest(body){
  const key=S.settings.apiKey.trim();
  const headers={"Content-Type":"application/json"};
  let model="claude-sonnet-4-6";
  body={...body};
  if(key){headers["x-api-key"]=key;headers["anthropic-version"]="2023-06-01";headers["anthropic-dangerous-direct-browser-access"]="true";model=S.settings.model;}
  const smart=key&&model==="claude-sonnet-5-5";
  if(smart){
    // Sonnet 5.5 thinks before answering; low effort keeps a chat tutor fast and cheap.
    // Room is added to max_tokens because thinking counts toward it (you only pay for what's used).
    body.output_config={effort:"low"};body.max_tokens+=1500;
    // If Sonnet declines a message, the API retries it on a fallback model instead of failing.
    headers["anthropic-beta"]="server-side-fallback-2026-07-01";body.fallbacks="default";
  }
  const go=async(h,b)=>{const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:h,body:JSON.stringify({model,...b})});let data=null;try{data=await res.json();}catch(e){}return{res,data};};
  let {res,data}=await go(headers,body);
  if(smart&&res.status===400&&data&&data.error&&/fallback|beta/i.test(data.error.message||"")){
    const h={...headers};delete h["anthropic-beta"];const b={...body};delete b.fallbacks;({res,data}=await go(h,b));
  }
  if(!res.ok||!data||data.error){const msg=(data&&data.error&&data.error.message)||("HTTP "+res.status);const err=new Error(msg);err.status=res.status;throw err;}
  if(data.stop_reason==="refusal"){const err=new Error("refusal");err.refusal=true;throw err;}
  return (data.content||[]).filter(b=>b.type==="text").map(b=>b.text||"").join("").trim();
}
function callAI(mode){
  const max={tiny:500,short:700,normal:1000,detailed:1600}[S.settings.style.length]||1000;
  return apiRequest({max_tokens:max,
    system:[{type:"text",text:systemPrompt(mode),cache_control:{type:"ephemeral"}},{type:"text",text:memoryPrompt()}],
    messages:buildMessages()});
}
// The hidden <<SAY>> line (spoken version for Ryusei) is taken out of the reply and kept separately
const sayWanted=()=>S.settings.tts==="quest"&&S.settings.enVoice==="ryusei";
function takeSay(raw){
  const i=raw.indexOf("<<SAY>>");if(i<0)return{raw,say:""};
  const rest=raw.slice(i+7),m=rest.indexOf("<<MEM>>");
  const say=(m<0?rest:rest.slice(0,m)).trim();
  return{raw:raw.slice(0,i).trimEnd()+(m<0?"":"\n"+rest.slice(m)),say};
}
function parseMem(raw){
  const i=raw.lastIndexOf("<<MEM>>");
  if(i<0)return{text:raw,mem:{}};
  const text=raw.slice(0,i).trim();let mem={};
  const m=raw.slice(i+7).match(/\{[\s\S]*\}/);
  if(m){try{mem=JSON.parse(m[0]);}catch(e){}}
  if(!mem||typeof mem!=="object"||Array.isArray(mem))mem={};
  return{text,mem};
}
// Yuki sometimes writes a field as text or as {"word":"meaning"} instead of a list; accept all of them
function asList(x){
  if(x==null||x===""||x===false)return[];
  if(Array.isArray(x))return x.flatMap(v=>v&&typeof v==="object"?asList(v):[String(v)]);
  if(typeof x==="object")return Object.entries(x).map(([k,v])=>typeof v==="string"&&v?k+" = "+v:k);
  return String(x).split(/\s*[;\n]\s*/).filter(Boolean);
}
function applyMem(mem){
  const p=S.profile;
  ["facts","learned","strong","weak","used","path"].forEach(k=>{if(k in mem)mem[k]=asList(mem[k]);});
  addUnique(p.facts,mem.facts,30);
  addUnique(p.learned,mem.learned,300);
  if(mem.strong&&mem.strong.length){addUnique(p.strong,mem.strong,30);p.weak=p.weak.filter(w=>!mem.strong.some(s=>s.toLowerCase()===w.toLowerCase()));}
  addUnique(p.weak,mem.weak,30);
  if(+mem.right)S.stats.quizRight+=+mem.right;
  if(+mem.wrong)S.stats.quizWrong+=+mem.wrong;
  if(Array.isArray(mem.used))markUsed(mem.used.map(String));
  if(Array.isArray(mem.path)){const added=mem.path.slice(0,2).filter(t=>addCustom(t));if(added.length)toast("⭐ Yuki added to your path: "+added.join(", "),3500);}
  if(mem.lessonDone&&S.currentLesson&&!S.done.includes(S.currentLesson)){S.done.push(S.currentLesson);toast("✅ Lesson complete!");}
}
async function send(display,apiText,mode){
  display=(display||"").trim();if(!display||UI.busy)return;
  UI.busy=true;touchDay();
  const box=S.chat;  // the reply goes to the chat this was sent from, even if you switch chats meanwhile
  box.push({role:"user",text:display,api:apiText||undefined});S.stats.msgs++;
  if(activeCourse()&&!apiText)markUsed(detectUsed(display));
  while(S.chat.length>200)S.chat.shift();
  save();
  if(!UI.voice&&UI.tab!=="chat"){UI.tab="chat";render();}else appendLast();
  showTyping(true);
  if(UI.voice){UI.vstate="thinking";renderVoice();}
  try{
    const raw=await callAI(UI.voice?"voice":mode);
    const t0=takeSay(raw),say=t0.say;
    const {text,mem}=parseMem(t0.raw);
    try{applyMem(mem);}catch(e){console.warn("memory skipped",e);}
    box.push({role:"assistant",text:text||"…",say:say||undefined});save();
    // A plan quiz or talk counts as done after a few back-and-forths with Yuki
    if(UI.planCtx&&++UI.planCtx.replies>=4){markNode(UI.planCtx.key);UI.planCtx=null;if(UI.tab==="chat"&&!UI.voice)rerenderChatHead();}
    showTyping(false);if(S.chat===box)appendLast();
    if(UI.voice){UI.vstate="speaking";renderVoice();speak(text,{say});}
    else if(S.settings.autoSpeakChat)speak(text,{say});
  }catch(err){
    showTyping(false);
    const noKey=!S.settings.apiKey.trim();
    const msg=noKey?"I need my own AI connection to think when I'm running outside Claude. Open <b>Me → AI setup</b> and paste your key — it takes two minutes.":
      (err.refusal?"Hmm, I can't answer that one. Let's try something else!":err.status===401?"Your API key was rejected. Check it in <b>Me → AI setup</b>.":err.status===429?"Too many requests at once — wait a few seconds and try again.":err.status===400&&/credit|balance/i.test(err.message)?"Your API account is out of credit. Top it up in the Anthropic Console.":"I couldn't connect ("+esc(err.message)+"). Check your internet and try again.");
    box.push({role:"assistant",text:msg,err:true});save();if(S.chat===box)appendLast();
    if(UI.voice){UI.vstate="idle";renderVoice();toast("Connection problem — see the chat");}
  }
  UI.busy=false;
  if(UI.voice&&UI.vstate!=="speaking"){UI.vstate="idle";renderVoice();}
}

/* ============ PATH ============ */
// N5 learners follow the conversation COURSE; other levels get a path built from that level's lessons.
// Custom lessons (added by you or by Yuki) are slotted in as ⭐ nodes.
const isoDay=d=>{d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
function ensurePlan(){if(!S.plan){S.plan={start:isoDay(),done:{},custom:[]};save();}return S.plan;}
const doneMap=()=>S.plan?S.plan.done:{};
const isN5Path=()=>S.level==="n5";
const UCOL=["#f4a3c0","#7cb8f4","#f2c36b","#9fd67c","#c59cf4"];
function pathUnits(){
  if(isN5Path())return COURSE.map((u,i)=>({title:"Unit "+(i+1),sub:u.t,e:u.e,c:u.c}));
  return(CUR[S.level]||[]).map(([u],i)=>({title:LV[S.level].label+" · Unit "+(i+1),sub:u,e:"📘",c:UCOL[i%5]}));
}
function pathNodes(){
  let nodes=[];
  if(isN5Path())COURSE.forEach((u,ui)=>{
    const [a,b,c]=u.ls;
    nodes.push({key:"cl:"+a.id,t:"CL",k:a.id,unit:ui},{key:"cl:"+b.id,t:"CL",k:b.id,unit:ui},{key:"ck:"+ui,t:"CK",k:u.kana,unit:ui},{key:"cl:"+c.id,t:"CL",k:c.id,unit:ui},{key:"cr:"+ui,t:"CR",k:ui,unit:ui});
  });
  else(CUR[S.level]||[]).forEach(([u,ls],ui)=>{ls.forEach(l=>nodes.push({key:"L:"+l[0],t:"L",k:l[0],unit:ui}));nodes.push({key:S.level+":"+ui+":q",t:"Q",k:"unit",unit:ui});});
  const custom=S.plan?S.plan.custom.filter(c=>!c.level||c.level===S.level):[];
  if(custom.length){
    const firstOpen=nodes.find(n=>!nodeDone(n));
    custom.forEach(c=>{
      let at=nodes.findIndex(n=>n.key===c.before);
      if(at<0){const f=firstOpen?nodes.findIndex(n=>n.key===firstOpen.key):-1;at=f>=0?f:nodes.length;}
      const unit=nodes[at]?nodes[at].unit:(nodes.length?nodes[nodes.length-1].unit:0);
      nodes.splice(at,0,{key:"c:"+c.id,t:"X",k:c.id,title:c.title,unit});
    });
  }
  return nodes;
}
function nodeDone(n){return !!doneMap()[n.key]||(n.t==="L"&&S.done.includes(n.k));}
const curNode=()=>pathNodes().find(n=>!nodeDone(n))||null;
function markNode(key,quiet){
  ensurePlan();if(S.plan.done[key])return;
  S.plan.done[key]=true;save();
  if(!quiet)toast("✓ Done! Next step unlocked",1800);
}
function planAuto(t,k){
  if(!S.plan)return;
  const open=pathNodes().filter(n=>!nodeDone(n)).slice(0,3);
  const hit=open.find(n=>n.t===t&&n.k===k);
  if(hit)markNode(hit.key);
}
function nodeLabel(n){
  if(n.t==="CL")return clessonById(n.k).t;

  if(n.t==="CR")return COURSE[n.k].rp==="FINAL"?"Your big conversation":"Roleplay: "+COURSE[n.k].t;

function nodeIcon(n){
  if(n.t==="CL")return COURSE[n.unit].e;

const modeTag=n=>(n.t==="CL"||n.t==="CR")?(isSpeakingKey(n.key)?"🎙️ Speaking":"💬 Chat"):"";
const nodeSub=n=>n.t==="CL"?"5 new words · learn, practise, "+(isSpeakingKey(n.key)?"then a call":"then chat"):n.t==="CK"?"5 new characters":n.t==="CR"?"A spoken roleplay with this unit's words":"";

/* ---- word memory (spaced repetition shared with flashcards) ---- */
function bumpWord(id,ok){
  const c=S.cards[id]||{box:0,due:0};
  if(ok){c.box=Math.min(c.box+1,6);c.due=Date.now()+INT[c.box];}else{c.box=0;c.due=Date.now();}

// Older course words that are due (or weakest), for review questions and for Yuki to ask about
function reviewWords(exclude,n){
  const now=Date.now(),ex=new Set(exclude||[]);
  return Object.keys(S.cards).filter(i=>i.startsWith("w:")&&!ex.has(i.slice(2)))
    .sort((a,b)=>((S.cards[a].due<=now?0:1)-(S.cards[b].due<=now?0:1))||(S.cards[a].box-S.cards[b].box))
    .slice(0,n).map(i=>i.slice(2));
}
const wordInfo=jp=>{for(const l of CLESSONS)for(const w of l.w)if(w[0]===jp)return w;return null;};

const itemId=(lp,it)=>lp.kind==="kana"?it[3]:"w:"+it[0];
function buildQuiz(lp){
  const its=lp.items,qs=[],pool=lp.kind==="kana"?Object.values(KANA_POOL()):CLESSONS.flatMap(l=>l.w);
  const others=(it,f)=>shuffle(pool.filter(x=>f(x)!==f(it))).slice(0,3).map(f);
  its.forEach(it=>{const f=lp.kind==="kana"?(x=>x[1]):(x=>x[2]);qs.push({it,q:it[0],say:lp.kind==="kana"?it[0]:wordSay(it[0]),a:f(it),opts:shuffle([f(it),...others(it,f)]),dir:"jp"});});
  shuffle(its.slice()).slice(0,3).forEach(it=>{const f=x=>x[0];const a=it[0],q=lp.kind==="kana"?it[1]:it[2];qs.push({it,q,a,opts:shuffle([a,...shuffle(pool.filter(x=>x[0]!==a)).slice(0,3).map(f)]),dir:"en"});});
  if(lp.kind==="words")reviewWords(its.map(x=>x[0]),2).forEach(jp=>{const w=wordInfo(jp);if(w)qs.push({it:w,q:w[0],say:wordSay(w[0]),a:w[2],opts:shuffle([w[2],...shuffle(pool.filter(x=>x[2]!==w[2])).slice(0,3).map(x=>x[2])]),dir:"jp",review:true});});

}
const KANA_POOL=()=>{const o={};COURSE.forEach(u=>[...u.kana].forEach(ch=>{const id=(/[ァ-ン]/.test(ch)?"k:":"h:")+ch;o[ch]=[ch,CARDS[id].back,"",id];}));return o;};

/* ---- conversation step: Yuki must get you to use the target words ---- */
function startTalk(n){
  let targets,kind,title,goal,scen="";
  if(n.t==="CL"){const l=clessonById(n.k);targets=l.w.map(w=>w[0]);kind="lesson";title=l.t;goal=l.g;}
  else{const u=COURSE[n.k],final=u.rp==="FINAL";
    const pool=final?CLESSONS.flatMap(l=>l.w):u.ls.flatMap(l=>l.w);
    targets=pool.map(w=>w[0]).sort((a,b)=>((S.cards["w:"+a]||{box:0}).box-(S.cards["w:"+b]||{box:0}).box)||Math.random()-0.5).slice(0,5);
    kind=final?"final":"roleplay";title=final?"Your big conversation":"Roleplay: "+u.t;goal=final?"Hold a real conversation using everything you've learned":"Use this unit's words in a real situation";scen=final?"":u.rp;}
  const speaking=isSpeakingKey(n.key);
  S.course={key:n.key,kind,title,goal,scen,targets,used:[],review:reviewWords(targets,kind==="lesson"?2:3),speaking};
  S.settings.micLang="ja-JP";
  openThread(n.key,(speaking?"🎙️ ":"💬 ")+title,speaking?"speak":"chat",true);
  S.currentLesson=null;UI.lp=null;UI.planCtx=null;save();UI.tab="chat";render();
  if(speaking)openVoice();
  send(kind==="lesson"?"💬 Let's practise: "+title:kind==="final"?"🎓 Start my big conversation":"🎭 Start the roleplay",
    kind==="final"?"Start my end-of-course conversation now.":kind==="roleplay"?"Start the roleplay now: set the scene in one short English line, then begin in character.":"I just learned these words. Start our practice conversation now.");
}
function coursePrompt(){
  const c=activeCourse();if(!c)return"";
  const wl=c.targets.map(jp=>{const w=wordInfo(jp);return w?`${w[0]} (${w[1]}) = ${w[2]}`:jp;}).join("; ");

const kataHira=t=>t.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));

const normR=t=>String(t).toLowerCase().replace(/[āâ]/g,"a").replace(/[ūû]/g,"u").replace(/[ōô]/g,"o").replace(/[ēê]/g,"e").replace(/[īî]/g,"i").replace(/[^a-z]/g,"").replace(/ou/g,"o").replace(/oo/g,"o").replace(/uu/g,"u").replace(/aa/g,"a").replace(/ee/g,"e").replace(/wa/g,"ha");

function soundKey(t){return normR(t).replace(/h/g,"").replace(/y/g,"i").replace(/w/g,"").replace(/(.)\1+/g,"$1").replace(/[ou]$/,"o");}

function soundsLike(text,romaji){
  const target=soundKey(romaji);if(target.length<4)return false;

function detectUsed(text){

function voicePicker(lang,label,cur){
  const list=voiceList(lang);
  if(!list.length)return"";
  const best=list[0];
  return`<label class="sub" style="display:block;margin-top:10px">${label}</label><select class="field" data-set="voice.${lang}">
   <option value=""${cur?"":" selected"}>Automatic (best: ${esc(best.name)})</option>

}

/* ============ VOICE CALL ============ */
function openVoice(){UI.voice=true;UI.vstate="idle";UI.vyou="";$("#voice").classList.remove("hidden");renderVoice();
  if(!S.chat.length||S.chat[S.chat.length-1].role!=="assistant"){/* nothing */}}
function closeVoice(){setAudioMode("auto");UI.voice=false;stopMic(true);stopSpeak();$("#voice").classList.add("hidden");if(UI.tab==="chat")render();}
function renderVoice(){
  if(!UI.voice)return;
  const last=[...S.chat].reverse().find(m=>m.role==="assistant");
  const st=UI.listening?"listening":UI.vstate;
  const other=UI.micLang==="ja-JP"?"en-US":"ja-JP";
  const label={idle:"Tap 🎤 日本語 or 🎤 English to answer",listening:"Listening in "+(UI.micLang==="en-US"?"English":"日本語")+" · tap ➤ Send when you're done",thinking:"Thinking…",speaking:"Yuki is talking · tap 🎤 to answer"}[st];
  const cap=last&&!last.err?esc(cleanSpeech(last.text).replace(/\s+\n/g,"\n").trim()).replace(/\n+/g,"<br>"):last&&last.err?"Connection problem — check the chat.":"Say hi! Try 「こんにちは」 or ask me anything in English.";
  const cc=S.settings.captions,len=S.settings.style.length;
  $("#voice").innerHTML=`<div class="vtop"><button class="iconbtn" data-act="closeVoice" aria-label="Close">✕</button>
   <div class="vtitle"><b>Yuki</b><small>${useQuest()?"🎌 "+(REC_VOICES[S.settings.jaRec]||REC_VOICES.ryusei).name.split(" ")[0]+"'s voice":useVV()?"🎌 "+(REC_VOICES[S.settings.jaRec]||REC_VOICES.himari).name.split(" ")[0]+"'s voice":useNatural()?"✨ natural voice":"voice call"}</small></div>
   <button class="iconbtn" data-act="vCaptions" aria-label="Captions" style="font-size:15px;font-weight:800">${cc?"CC":"🙈"}</button></div>
   <div class="vopts"><button class="vopt${S.settings.handsFree?" on":""}" data-act="vHands">${S.settings.handsFree?"🙌 Hands-free":"✋ Tap to talk"}</button>
    <span class="vlen">${[["tiny","Very short"],["short","Short"],["normal","Normal"]].map(([v,t])=>`<button class="vopt${len===v?" on":""}" data-act="vLen" data-v="${v}">${t}</button>`).join("")}</span></div>
   <div class="orbwrap${activeCourse()?" compact":""}"><div class="orb ${st}">ゆ</div><div class="vstat">${label}</div>
    ${activeCourse()?`<div class="vchips">${talkChips()}</div>${courseDoneCard(true)}${activeCourse().keep?`<button class="vopt on" data-act="courseDone" style="margin-top:6px">✓ Finish lesson</button>`:""}`:""}
    <div class="vcap">${UI.listening?`<div class="vtext vlive">${UI.vyou?esc(UI.vyou):"…"}</div>`:`<div class="vtext${cc?"":" off"}">${cap}</div><div class="vyou">${UI.vyou?"You: "+esc(UI.vyou):""}</div>`}</div></div>
   ${UI.listening?`<div class="vctrl">
    <button class="vbtn" data-act="vCancel"><i>✕</i>Cancel</button>
    <button class="micbtn ${other==="ja-JP"?"ja":"en"} alt" data-act="vMic" data-v="${other}" aria-label="Continue in ${other==="ja-JP"?"Japanese":"English"}"><span>⇄</span>${other==="ja-JP"?"+ 日本語":"+ English"}</button>
    <button class="micbtn send" data-act="vSend" aria-label="Send"><span>➤</span>Send</button>
    <button class="vbtn" data-act="closeVoice"><i class="vend">📞</i>End</button>
   </div>`:`<div class="vctrl">
    <button class="vbtn" data-act="vRepeat"><i>🔁</i>Repeat</button>
    <button class="vbtn" data-act="vSlow"><i>🐢</i>Slower</button>
    <button class="micbtn ja" data-act="vMic" data-v="ja-JP" aria-label="Speak Japanese"><span>🎤</span>日本語</button>
    <button class="micbtn en" data-act="vMic" data-v="en-US" aria-label="Speak English"><span>🎤</span>English</button>
    <button class="vbtn" data-act="closeVoice"><i class="vend">📞</i>End</button>
   </div>`}`;
}
setInterval(()=>{if(UI.voice&&UI.vstate==="speaking"&&!isSpeaking()){UI.vstate="idle";renderVoice();afterYukiSpoke();}},400);
function voiceMic(lang){
  lang=lang||S.settings.micLang;
  if(UI.listening){if(lang!==UI.micLang){switchMicLang(lang);return;}stopMic();return;}
  if(UI.busy)return;
  stopSpeak();UI.vyou="";S.settings.micLang=lang;
  startMic(t=>{UI.vyou=t;const y=document.querySelector(".vlive");if(y)y.textContent=t||"…";},
    final=>{if(final){UI.vyou=final;send(final,null,"voice");}else{UI.vstate="idle";renderVoice();}},lang);
}
// Hands-free: when Yuki finishes talking, start listening for your answer (you still tap Send)
function afterYukiSpoke(){const c=activeCourse();if(c&&c.used.length>=c.targets.length&&!c.keep)return;if(UI.voice&&S.settings.handsFree&&!UI.listening&&!UI.busy)setTimeout(()=>{if(UI.voice&&!UI.listening&&!UI.busy&&!isSpeaking())voiceMic(S.settings.micLang);},500);}

function sheet(html){const s=$("#sheet");s.innerHTML=`<div class="sh">${html}</div>`;s.classList.remove("hidden");}
function closeSheet(){$("#sheet").classList.add("hidden");$("#sheet").innerHTML="";}
$("#sheet").addEventListener("click",e=>{if(e.target.id==="sheet")closeSheet();});

/* ============ ACTIONS ============ */
function startLesson(id,keepLevel){
  const l=lessonById(id);if(!l)return;
  S.currentLesson=id;if(!keepLevel&&l.level!==S.level)S.level=l.level;
  openThread("L:"+id,"📖 "+l.title,"lesson",true);
  UI.tab="chat";render();
  send(`📖 Start lesson: ${l.title}`,`Let's start the lesson "${l.title}" (${l.desc}). Teach me step by step at my level, starting from the basics of this topic.`);
}
const QUIZ_PROMPTS={
  kana:"Give me a 10-question kana reading quiz: show a short hiragana or katakana word (only kana I've learned), I type how it sounds in romaji, then tell me what it means. One at a time.",
  mixed:"Give me a 10-question mixed quiz at my level (vocab, grammar, kanji, reading). One question at a time.",
    vocab:"Give me a 10-question vocabulary quiz at my level, mixing Japanese→English and English→Japanese. One at a time.",
  grammar:"Give me a 10-question grammar quiz at my level: fill-in-the-blank particles and verb forms. One at a time.",
  kanji:"Give me a 10-question kanji quiz at my level: readings and meanings. One at a time.",
  listen:"Give me a 10-question listening quiz. Put each Japanese sentence in [[double brackets]] so it's hidden, then ask me a question about it. One at a time.",
  translate:"Give me a 10-sentence English→Japanese translation challenge at my level, using things I've learned. One at a time, correct each one carefully.",
  roleplay:"Let's do a roleplay. Pick a realistic situation for my level and goal (café, station, hotel, shop, meeting someone new), set the scene in one line, then start speaking in character in Japanese. Correct me gently as we go."
};
function startQuiz(q){
  const t=QUIZZES.find(x=>x[0]===q);
  let p=QUIZ_PROMPTS[q];
  if(q==="weak")p=`Drill my weak spots with a 10-question quiz, one at a time: ${S.profile.weak.slice(-12).join(", ")||"pick what learners at my level usually struggle with"}.`;
  S.currentLesson=null;openThread("q:"+q,"🧩 "+(t?t[2]:"Quiz"),"quiz",true);UI.tab="chat";render();
  send(`🧩 ${t?t[2]:"Quiz"}`,p);
}

  placeStop:()=>{const ob=UI.place.ob;UI.place=null;if(ob)UI.ob=ob;render();},

    if(r.bands.kana[0]===r.bands.kana[1]&&!S.about.hira)S.about.hira="all";
    const ob=P.ob;UI.place=null;save();toast("Level set to "+LV[r.level].label);
    if(ob)UI.ob=ob===1?2:ob;render();},
  placeKeep:()=>{const P=UI.place;S.placement=P.result;const ob=P.ob;UI.place=null;save();if(ob)UI.ob=ob===1?2:ob;render();},
  obFinish:()=>{S.about.done=true;

    if(S._kana){S.done.push("intro","sounds");}delete S._kana;
    touchDay();save();UI.tab="home";render();},
  lesson:el=>{UI.planCtx=null;startLesson(el.dataset.id);},

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;
  const fn=ACT[el.dataset.act];if(!fn)return;
  if(el.closest("#sheet")&&!["closeSheet","copyBackup","doImport","addSuggest","addLesson","copyDock","questTest","iphoneVoiceTest"].includes(el.dataset.act))closeSheet();
  fn(el,e);
});
document.addEventListener("change",e=>{
  const el=e.target;const k=el.dataset&&el.dataset.set;if(!k)return;
  if(k==="name"||k==="goal")S[k]=el.value.trim();
  else if(k.startsWith("about."))S.about[k.slice(6)]=el.value.trim();
  else if(k==="azRegion"){S.settings.azRegion=el.value;natCache.clear();}
  else if(k==="azEn"||k==="azJa"){S.settings[k]=el.value;save();speak(k==="azEn"?"Hi! This is how I'll sound in English.":"こんにちは、ゆきです。よろしくね！",{forceEnglish:true});return;}
  else if(k==="voice.en"||k==="voice.ja"){S.settings[k==="voice.en"?"voiceEn":"voiceJa"]=el.value;save();speak(k==="voice.en"?"Hi! This is how I'll sound in English.":"こんにちは、ゆきです。",{forceEnglish:true});return;}
  else if(k==="rate")S.settings.rate=parseFloat(el.value);
  else if(k==="model")S.settings.model=el.value;
  save();if(k==="rate")speak("この速さでどうですか？",{});
});

// Save typed profile answers as you type, so a re-render never loses them
document.addEventListener("input",e=>{const k=e.target.dataset&&e.target.dataset.set;if(k&&k.startsWith("about.")){S.about[k.slice(6)]=e.target.value;save();}});

/* ============ iPHONE LAYOUT ============ */
function fitViewport(){const vv=window.visualViewport;const h=vv?vv.height:window.innerHeight;document.documentElement.style.setProperty("--vh",h+"px");window.scrollTo(0,0);const b=$("#msgs");if(b)b.scrollTop=b.scrollHeight;}
if(window.visualViewport){visualViewport.addEventListener("resize",fitViewport);}
window.addEventListener("resize",fitViewport);
(function icon(){try{const c=document.createElement("canvas");c.width=c.height=180;const x=c.getContext("2d");const g=x.createLinearGradient(0,0,180,180);g.addColorStop(0,"#f4a3c0");g.addColorStop(1,"#a8577a");x.fillStyle=g;x.fillRect(0,0,180,180);x.fillStyle="#2a1520";x.font="bold 110px 'Hiragino Sans',sans-serif";x.textAlign="center";x.textBaseline="middle";x.fillText("ゆ",90,98);$("#touchIcon").href=c.toDataURL("image/png");}catch(e){}})();

/* ============ UPDATES ============ */
// Auto-update: compare this page's own code with the live copy on GitHub Pages.
// Comparing the code itself (not just APP_VERSION) means any change gets picked up.
let lastCheck=0,updPending=false;
const UPD_KEY="yuki-upd-at";
const norm=t=>(t||"").replace(/\r\n/g,"\n").trim();
function liveDiffers(html){
  const js=(html.match(/<script>([\s\S]*?)<\/script>/)||[])[1],css=(html.match(/<style>([\s\S]*?)<\/style>/)||[])[1];
  if(js===undefined||css===undefined)return false;
  return norm(js)!==norm(document.querySelector("script").textContent)||norm(css)!==norm(document.querySelector("style").textContent);
}
// Safe moment = nothing in progress that a reload would interrupt
function canReloadNow(){
  const a=document.activeElement,typing=a&&/INPUT|TEXTAREA/.test(a.tagName)&&a.value;
  const midCards=UI.fc&&UI.fc.i>0&&UI.fc.i<UI.fc.q.length;
  return !UI.busy&&!UI.voice&&!UI.listening&&!UI.place&&!midCards&&!typing;
}
function applyUpdate(){
  // Loop guard: never auto-reload more than once every 2 minutes
  let at=0;try{at=+localStorage.getItem(UPD_KEY)||0;}catch(e){}
  if(Date.now()-at<120e3)return false;
  try{localStorage.setItem(UPD_KEY,String(Date.now()));}catch(e){}
  saveNow();location.replace(location.pathname+"?v="+Date.now());return true;
}
function checkUpdate(manual){
  if(location.protocol==="file:"){if(manual)toast("Updates only work on the website version");return;}
  lastCheck=Date.now();
  fetch(location.pathname+"?check="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.text():"").then(t=>{
    if(!t||!liveDiffers(t)){if(manual)toast("You're on the latest version ✓");return;}
    if(manual||canReloadNow()){if(!applyUpdate()&&manual)toast("Updating… if nothing changes, close and reopen Yuki");}
    else if(!updPending){updPending=true;toast("✨ Update ready — it'll load next time you open Yuki",3000);}
  }).catch(()=>{if(manual)toast("Couldn't check — are you online?");});
}
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible")pingVV();
  if(document.visibilityState==="hidden"){saveNow();if(updPending)applyUpdate();return;}
  if(updPending){if(applyUpdate())return;}
  if(Date.now()-lastCheck>60e3)checkUpdate(false);
});
// While the app stays open, look again every 15 minutes
setInterval(()=>{if(document.visibilityState==="visible")checkUpdate(false);},15*60e3);

/* ============ START ============ */
loadState().then(()=>{fitViewport();render();pingVV();setTimeout(()=>checkUpdate(false),1500);});
